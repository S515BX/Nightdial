# Builds the iPhone/iPad app on a GitHub-hosted Mac. On the main branch it also puts it on the "ios" release:
#   https://github.com/<you>/<repo>/releases/download/ios/Nightdial.ipa
# The .ipa is unsigned on purpose: Sideloadly signs it with your Apple ID when it installs it.
# Builds on other branches (for example "dev") only keep the .ipa as a workflow artifact, for testing before release.
# The bundle ID stays app.tuner.player from the first release, so updates install over the existing app and keep its playlists.
name: Build iOS IPA

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/build-ios.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Intel Macs: GitHub's Apple-silicon Macs were too busy to start builds (Oct 2026). Either kind builds the same app.
    runs-on: macos-15-intel
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Build the app
        run: |
          set -o pipefail
          xcodebuild -project Nightdial.xcodeproj -target Nightdial -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" \
            PRODUCT_BUNDLE_IDENTIFIER=app.tuner.player \
            DEVELOPMENT_TEAM="" CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -80 || true

      - name: Package Nightdial.ipa
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/Nightdial.app Payload/
          zip -qry Nightdial.ipa Payload
          ls -lh Nightdial.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Nightdial-ipa
          path: ios/Nightdial.ipa
          if-no-files-found: error

      - name: Publish to Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          SHA=$(shasum -a 256 Nightdial.ipa | cut -d' ' -f1)
          NOTES="Newest Nightdial build for iPhone and iPad (unsigned). Install it with Sideloadly, which signs it with your Apple ID.

          SHA-256 of Nightdial.ipa: \`$SHA\`"
          gh release view ios >/dev/null 2>&1 || gh release create ios --target "$GITHUB_SHA" --title "Nightdial for iPhone and iPad" --notes "$NOTES"
          gh release edit ios --title "Nightdial for iPhone and iPad" --notes "$NOTES"
          gh release upload ios Nightdial.ipa --clobber
          # only the current file stays on the release (older names are removed)
          gh release view ios --json assets -q '.assets[].name' | grep -vx 'Nightdial.ipa' | while read -r old; do gh release delete-asset ios "$old" -y; done
          echo "### Download Nightdial.ipa" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${GH_REPO}/releases/download/ios/Nightdial.ipa" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: ios/build.log
