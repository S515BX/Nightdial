# Builds the iPhone/iPad app on a GitHub-hosted Mac. On the main branch it also puts it on the "ios" release:
#   https://github.com/<you>/<repo>/releases/download/ios/Nightdial.ipa
# The .ipa is unsigned on purpose: Sideloadly signs it with your Apple ID when it installs it.
# Builds on other branches (for example "dev") only keep the .ipa as a workflow artifact, for testing before release.
# The bundle ID stays app.tuner.player from the first release, so updates install over the existing app and keep its playlists.
name: Build iOS IPA

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/build-ios.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Xcode 27.1 has the iOS 27.1 SDK: built with it, the app gets the whole screen on iPhone Duo (both displays) instead
    # of running at an older iPhone's size. GitHub has Xcode 27 on Apple-silicon Macs only.
    runs-on: xcode-27
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: |
          if [ -d /Applications/Xcode_27.1.app ]; then sudo xcode-select -s /Applications/Xcode_27.1.app; fi
          xcodebuild -version
          echo "iOS SDK $(xcrun --sdk iphoneos --show-sdk-version)"
          # iPhone Duo needs the iOS 27.1 SDK or later
          xcrun --sdk iphoneos --show-sdk-version | awk -F. '{ exit !($1 > 27 || ($1 == 27 && $2 >= 1)) }'

      # VLCKit plays channels Apple's player can't show (HEVC or MPEG-2 video, often 24/7 channels)
      - uses: actions/cache@v4
        with:
          path: ios/Vendor
          key: vlckit-3.7.5-a76f7a6c

      - name: Fetch VLCKit
        run: ./fetch-vlckit.sh

      - name: Build the app
        run: |
          set -o pipefail
          xcodebuild -project Nightdial.xcodeproj -target Nightdial -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" \
            PRODUCT_BUNDLE_IDENTIFIER=app.tuner.player \
            DEVELOPMENT_TEAM="" CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            'FRAMEWORK_SEARCH_PATHS=$(inherited) $(PROJECT_DIR)/Vendor/vlc-$(PLATFORM_NAME)' \
            'OTHER_LDFLAGS=$(inherited) -ObjC -framework MobileVLCKit -framework QuartzCore -framework CoreText -framework AVFoundation -framework Security -framework CFNetwork -framework AudioToolbox -framework OpenGLES -framework CoreGraphics -framework VideoToolbox -framework CoreMedia -lc++ -lxml2 -lz -lbz2 -liconv' \
            build 2>&1 | tee build.log

      - name: Put VLCKit inside the app
        run: |
          app=build/Release-iphoneos/Nightdial.app
          fw=Vendor/vlc-iphoneos/MobileVLCKit.framework
          file "$fw/MobileVLCKit"
          otool -L "$app/Nightdial" | grep -i -E "vlc|rpath" || true
          if otool -L "$app/Nightdial" | grep -q "MobileVLCKit.framework/MobileVLCKit"; then
            # VLCKit is a dynamic framework: it ships inside the app (Sideloadly signs it along with the app)
            mkdir -p "$app/Frameworks"
            rsync -a --exclude Headers --exclude PrivateHeaders --exclude Modules --exclude '*.bcsymbolmap' "$fw" "$app/Frameworks/"
            test -x "$app/Frameworks/MobileVLCKit.framework/MobileVLCKit"
            otool -l "$app/Nightdial" | grep -A2 LC_RPATH | grep -q "@executable_path/Frameworks"
          else
            # linked in statically: its code must be in the app's own binary
            test "$(stat -f%z "$app/Nightdial")" -gt 20000000
          fi
          du -sh "$app" "$app/Frameworks" 2>/dev/null || true

      - name: Show build errors
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -80 || true

      - name: Package Nightdial.ipa
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/Nightdial.app Payload/
          zip -qry Nightdial.ipa Payload
          ls -lh Nightdial.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Nightdial-ipa
          path: ios/Nightdial.ipa
          if-no-files-found: error

      - name: Publish to Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          SHA=$(shasum -a 256 Nightdial.ipa | cut -d' ' -f1)
          NOTES="Newest Nightdial build for iPhone and iPad (unsigned). Install it with Sideloadly, which signs it with your Apple ID.

          SHA-256 of Nightdial.ipa: \`$SHA\`"
          gh release view ios >/dev/null 2>&1 || gh release create ios --target "$GITHUB_SHA" --title "Nightdial for iPhone and iPad" --notes "$NOTES"
          gh release edit ios --title "Nightdial for iPhone and iPad" --notes "$NOTES"
          gh release upload ios Nightdial.ipa --clobber
          # only the current file stays on the release (older names are removed)
          gh release view ios --json assets -q '.assets[].name' | grep -vx 'Nightdial.ipa' | while read -r old; do gh release delete-asset ios "$old" -y; done
          echo "### Download Nightdial.ipa" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${GH_REPO}/releases/download/ios/Nightdial.ipa" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: ios/build.log
