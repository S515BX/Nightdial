<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f15">
<title>Tuner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--TUNER_PROXY-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;1,500&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: living-room TV guide. Icon rail · preview screen beside program details · EPG grid with sticky channel column, sticky timebar and a live "now" line. One committed dark look (TV room at night). */
:root{
  color-scheme:dark;
  --bg:#0a0f15;          /* room */
  --panel:#0f1720;       /* guide + drawers */
  --cell:#16212c;        /* program block */
  --cell-now:#1d2c3b;    /* airing now */
  --cell-hover:#243546;
  --line:#21303f;
  --line-soft:#18232e;
  --fg:#e9eef3;
  --fg-2:#a3b3c3;
  --fg-3:#6c7f92;
  --accent:#f5a83c;      /* tally-lamp amber: focus + now */
  --accent-ink:#1b1206;
  --accent-soft:rgba(245,168,60,.18);
  --live:#ef4a40;
  --ok:#5fd39a;
  --warn:#f0c04a;
  --font-display:"Barlow Semi Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --railW:74px;
  --chanW:232px;
  --rowH:62px;
  --headH:44px;
}
:root.rows-compact{--rowH:50px}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 var(--font-body);-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.fill{fill:currentColor;stroke:none}

/* ---------- shell ---------- */
.app{height:100%;display:grid;grid-template-columns:var(--railW) minmax(0,1fr);gap:16px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rail{display:flex;flex-direction:column;gap:4px;min-height:0}
.brand{display:flex;justify-content:center;padding:4px 0 14px}
.brand-mark{position:relative;width:38px;height:38px;border-radius:11px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font:700 19px/1 var(--font-display);letter-spacing:-.02em}
.brand-mark::after{content:"";position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.rail-btn{display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 2px 9px;border-radius:12px;color:var(--fg-3);font:600 10.5px/1 var(--font-display);letter-spacing:.06em;text-transform:uppercase}
.rail-btn .i{width:22px;height:22px}
.rail-btn:hover{color:var(--fg);background:var(--panel)}
.rail-btn.active{color:var(--fg);background:var(--panel)}
.rail-btn.active .i{color:var(--accent)}
.rail-btn:focus-visible{outline:none;background:var(--accent);color:var(--accent-ink)}
.rail-btn:focus-visible .i{color:var(--accent-ink)}
.rail .spacer{flex:1}
.main{display:grid;grid-template-rows:auto minmax(0,1fr);gap:16px;min-width:0;min-height:0}

/* ---------- hero: preview + details ---------- */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;height:clamp(190px,35vh,360px);min-height:0}
.stage{position:relative;height:100%;aspect-ratio:16/9;max-width:56vw;border-radius:12px;overflow:hidden;background:#000;box-shadow:0 0 0 1px var(--line)}
.screen{position:absolute;inset:0;cursor:pointer}
.screen canvas,.screen video{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:contain;background:#000}
.screen-msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;text-align:center;background:rgba(5,8,12,.82);font-size:14px;color:var(--fg-2)}
.screen-msg b{font:600 18px var(--font-display);color:var(--fg)}
.spinner{position:absolute;left:50%;top:50%;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;border:3px solid rgba(255,255,255,.18);border-top-color:var(--accent);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pill{position:absolute;left:10px;bottom:10px;display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:rgba(5,8,12,.78);font:600 12px var(--font-display);letter-spacing:.04em;color:var(--fg)}
.pill .i{width:16px;height:16px}
.expand-hint{position:absolute;right:10px;top:10px;padding:6px;border-radius:8px;background:rgba(5,8,12,.6);opacity:0;transition:opacity .2s}
.screen:hover .expand-hint{opacity:1}
.app.is-full .expand-hint{display:none}
.info{display:flex;flex-direction:column;gap:9px;min-width:0;min-height:0;overflow:hidden;padding-top:2px}
.info-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.info-chan{display:flex;align-items:center;gap:10px;min-width:0;font:600 15px var(--font-display);color:var(--fg-2)}
.info-chan .num{color:var(--fg-3);font-variant-numeric:tabular-nums}
.info-chan .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{font:600 24px/1 var(--font-display);font-variant-numeric:tabular-nums;color:var(--fg);flex:none}
.info-title{margin:2px 0 0;font:600 clamp(24px,2.7vw,40px)/1.04 var(--font-display);letter-spacing:-.005em;text-wrap:balance;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.info-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;color:var(--fg-2);font-variant-numeric:tabular-nums}
.info-meta .sep{color:var(--fg-3)}
.badge{display:inline-flex;align-items:center;gap:4px;font:600 11px/1 var(--font-display);letter-spacing:.07em;text-transform:uppercase;padding:4px 6px;border-radius:4px;border:1px solid var(--line);color:var(--fg-2)}
.badge.live{background:var(--live);border-color:var(--live);color:#fff}
.badge.new{border-color:var(--accent);color:var(--accent)}
.badge .i{width:12px;height:12px}
.progress{height:4px;border-radius:2px;background:var(--line);overflow:hidden;max-width:540px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:2px}
.info-desc{margin:0;max-width:68ch;color:var(--fg-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.info-next{color:var(--fg-3);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info-next b{color:var(--fg-2);font-weight:500}

/* ---------- logos ---------- */
.logo{position:relative;flex:none;width:40px;height:40px;border-radius:9px;display:grid;place-items:center;overflow:hidden;font:700 14px/1 var(--font-display);letter-spacing:.02em;color:#fff;background:hsl(var(--h,210),38%,30%)}
.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#0c131a;padding:3px}
.logo.sm{width:30px;height:30px;border-radius:7px;font-size:12px}

/* ---------- EPG grid ---------- */
.guide{position:relative;min-height:0;border-radius:12px;background:var(--panel);box-shadow:0 0 0 1px var(--line);overflow:hidden}
.guide-scroll{position:absolute;inset:0;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--line) transparent;outline:none}
.guide-scroll:focus-visible{box-shadow:inset 0 0 0 2px var(--accent-soft)}
.guide-canvas{position:relative}
.timebar{position:sticky;top:0;z-index:6;display:flex;height:var(--headH);background:var(--panel);border-bottom:1px solid var(--line)}
.corner{position:sticky;left:0;z-index:2;flex:none;width:var(--chanW);height:100%;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:0 14px;background:var(--panel);border-right:1px solid var(--line);text-align:left}
.corner:hover .g{color:var(--accent)}
.corner .g{display:flex;align-items:center;gap:6px;max-width:100%;font:600 15px/1.1 var(--font-display)}
.corner .g span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.corner .g .i{width:14px;height:14px;color:var(--fg-3)}
.corner .d{font:600 11px/1 var(--font-display);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}
.ticks{position:relative;flex:none;height:100%;overflow:hidden}
.tick{position:absolute;top:0;height:100%;display:flex;align-items:flex-start;padding:8px 0 0 9px;border-left:1px solid var(--line);font:500 14px/1 var(--font-display);font-variant-numeric:tabular-nums;color:var(--fg-2);white-space:nowrap}
.tick.day{color:var(--fg);border-left-color:var(--fg-3)}
.tick.day b{font-weight:600;color:var(--accent);margin-right:6px;text-transform:uppercase;letter-spacing:.06em;font-size:12px}
.now-tick{position:absolute;bottom:0;z-index:1;transform:translateX(-50%);padding:2px 6px 3px;border-radius:5px 5px 0 0;background:var(--accent);color:var(--accent-ink);font:700 11px/1 var(--font-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.rows{position:relative}
.row{position:absolute;left:0;display:flex;height:var(--rowH)}
.chan{position:sticky;left:0;z-index:4;flex:none;width:var(--chanW);height:100%;display:flex;align-items:center;gap:10px;padding:0 12px 0 8px;background:var(--panel);border-right:1px solid var(--line);border-bottom:1px solid var(--line-soft);cursor:pointer;min-width:0}
.chan:hover{background:#121c26}
.chan.cur{background:var(--cell-now)}
.cnum{width:34px;flex:none;text-align:right;font:600 14px/1 var(--font-display);font-variant-numeric:tabular-nums;color:var(--fg-3)}
.chan.cur .cnum{color:var(--accent)}
.cname{flex:1;min-width:0;font:500 15px/1.15 var(--font-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chan .star{width:14px;height:14px;color:var(--accent);flex:none}
.eq{display:flex;align-items:flex-end;gap:2px;height:13px;flex:none}
.eq i{width:3px;height:100%;background:var(--accent);border-radius:1px;transform-origin:bottom;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.35s}.eq i:nth-child(3){animation-delay:-.7s}
@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.progs{position:relative;flex:none;height:100%}
.prog{position:absolute;top:3px;bottom:3px;margin-left:2px;border-radius:7px;background:var(--cell);padding:0 10px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:3px;cursor:pointer;user-select:none}
.prog:hover{background:var(--cell-hover)}
.prog.now{background:var(--cell-now)}
.prog .pt,.prog .ps{position:sticky;left:calc(var(--chanW) + 10px);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog .pt{font:500 15px/1.15 var(--font-display);color:var(--fg)}
.prog .ps{font-size:12px;line-height:1;color:var(--fg-3);font-variant-numeric:tabular-nums}
.prog.past .pt{color:var(--fg-2)}
.prog .lv{display:inline-block;margin-right:6px;padding:2px 4px 1px;border-radius:3px;background:var(--live);color:#fff;font:700 10px/1 var(--font-display);letter-spacing:.06em;vertical-align:2px}
.prog .cu{width:13px;height:13px;margin-right:5px;vertical-align:-2px;color:var(--fg-2)}
.prog .pb{position:absolute;left:0;bottom:0;height:3px;max-width:100%;border-radius:0 0 0 7px;background:var(--accent);opacity:.8}
.prog.focus{background:var(--accent)}
.prog.focus .pt,.prog.focus .ps,.prog.focus .cu{color:var(--accent-ink)}
.prog.focus .pb{background:var(--accent-ink);opacity:.35}
.prog.tiny{padding:0}
.prog.tiny .pt,.prog.tiny .ps{display:none}
.prog.empty{background:transparent;border:1px dashed var(--line)}
.prog.empty .pt{color:var(--fg-3);font-weight:400}
.prog.empty.focus{background:var(--accent-soft);border-color:var(--accent)}
.prog.empty.focus .pt{color:var(--fg)}
.nowline{position:absolute;top:var(--headH);bottom:0;z-index:3;width:2px;margin-left:-1px;background:var(--accent);box-shadow:0 0 12px rgba(245,168,60,.45);pointer-events:none}
.guide-empty{position:absolute;inset:var(--headH) 0 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:24px;text-align:center;color:var(--fg-2)}
.guide-empty b{font:600 20px var(--font-display);color:var(--fg)}

/* ---------- fullscreen ---------- */
.app.is-full .stage{position:fixed;inset:0;z-index:50;max-width:none;width:auto;height:auto;aspect-ratio:auto;border-radius:0;box-shadow:none}
.app.is-full .screen{cursor:default}
.osd{display:none;position:absolute;left:0;right:0;bottom:0;z-index:2;flex-direction:column;gap:10px;padding:96px max(32px,env(safe-area-inset-right,0px)) max(26px,env(safe-area-inset-bottom,0px)) max(32px,env(safe-area-inset-left,0px));background:linear-gradient(rgba(5,8,12,0),rgba(5,8,12,.82) 30%,rgba(5,8,12,.95) 60%);transition:opacity .25s,transform .25s}
.app.is-full .osd{display:flex}
.osd.hide{opacity:0;transform:translateY(14px);pointer-events:none}
.osd-top{display:flex;align-items:center;gap:12px;font:600 18px var(--font-display)}
.osd-top .num{color:var(--accent);font-variant-numeric:tabular-nums}
.osd-top .name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.osd-top .clock{font-size:26px}
.osd-now{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.osd-title{font:600 clamp(24px,3.4vw,44px)/1.05 var(--font-display);text-wrap:balance}
.osd-time{color:var(--fg-2);font-variant-numeric:tabular-nums}
.osd .progress{max-width:none}
.osd-next{color:var(--fg-2)}
.osd-next b{color:var(--fg-3);font:600 12px var(--font-display);letter-spacing:.08em;text-transform:uppercase;margin-right:8px}
.osd-ctrls{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.osd-btn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 14px;border-radius:10px;background:rgba(255,255,255,.08);font:600 15px var(--font-display)}
.osd-btn:hover{background:rgba(255,255,255,.16)}
.osd-btn.on .i{color:var(--accent)}
.cu-flag{position:absolute;top:max(18px,env(safe-area-inset-top,0px));left:max(18px,env(safe-area-inset-left,0px));z-index:2;display:none;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font:700 12px var(--font-display);letter-spacing:.06em;text-transform:uppercase}

/* ---------- overlays ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(3,6,10,.6)}
.drawer{position:fixed;top:0;bottom:0;z-index:61;width:min(380px,100%);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:inL .22s ease-out}
.drawer.left{left:0;border-width:0 1px 0 0;padding-left:env(safe-area-inset-left,0px)}
.drawer.right{right:0;border-width:0 0 0 1px;padding-right:env(safe-area-inset-right,0px);animation-name:inR}
@keyframes inL{from{transform:translateX(-24px);opacity:0}}
@keyframes inR{from{transform:translateX(24px);opacity:0}}
.drawer header,.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 20px 12px}
.drawer h2,.sheet-head h2{margin:0;font:600 24px/1 var(--font-display)}
.icon-btn{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;color:var(--fg-2)}
.icon-btn:hover{background:var(--cell);color:var(--fg)}
.list{flex:1;min-height:0;overflow:auto;padding:4px 10px 18px;display:flex;flex-direction:column;gap:2px}
.item{display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:9px 12px;border-radius:10px;color:var(--fg-2);text-align:left}
.item:hover{background:var(--cell);color:var(--fg)}
.item:focus-visible{outline:none;background:var(--accent);color:var(--accent-ink)}
.item:focus-visible .n,.item:focus-visible .sub{color:var(--accent-ink)}
.item.sel{color:var(--fg);background:var(--cell)}
.item.sel .mark{color:var(--accent)}
.item .mark{width:18px;height:18px;flex:none;color:transparent}
.item .lbl{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .lbl > span:first-child{font:500 16px/1.2 var(--font-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sub{font-size:13px;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .n{margin-left:auto;font:500 14px var(--font-display);font-variant-numeric:tabular-nums;color:var(--fg-3)}
.list-label{padding:14px 12px 6px;font:600 11px var(--font-display);letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3)}
.drawer-foot{padding:12px 20px 20px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.search{position:fixed;left:50%;top:max(24px,env(safe-area-inset-top,0px));z-index:61;width:min(700px,calc(100% - 32px));max-height:calc(100% - 48px);transform:translateX(-50%);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.search-bar{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 18px;border-bottom:1px solid var(--line)}
.search-bar input{flex:1;min-width:0;height:44px;border:0;background:transparent;font-size:18px;outline:none}
.search-bar .i{color:var(--fg-3)}
.modal{position:fixed;inset:0;z-index:62;display:grid;place-items:center;padding:16px;pointer-events:none}
.modal-card{pointer-events:auto;width:min(560px,100%);max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:12px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.modal-card h2{margin:0;font:600 30px/1.05 var(--font-display);text-wrap:balance}
.modal-card p{margin:0;color:var(--fg-2)}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:10px;font:600 16px var(--font-display);letter-spacing:.02em;white-space:nowrap}
.btn .i{width:18px;height:18px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:var(--cell);color:var(--fg)}
.btn.ghost:hover{background:var(--cell-hover)}
.btn.danger{background:transparent;color:#ff9b93;box-shadow:inset 0 0 0 1px rgba(239,74,64,.45)}
.btn.danger.armed{background:var(--live);color:#fff}
.btn:disabled{opacity:.6;cursor:progress}
.toast{position:fixed;left:50%;bottom:max(24px,calc(env(safe-area-inset-bottom,0px) + 16px));z-index:95;transform:translateX(-50%);max-width:calc(100% - 32px);padding:11px 16px;border-radius:10px;background:#1f2d3b;border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.4);font-size:14px}
.numentry{position:fixed;top:max(24px,env(safe-area-inset-top,0px));right:max(24px,env(safe-area-inset-right,0px));z-index:96;min-width:110px;padding:10px 20px;border-radius:12px;background:var(--panel);border:1px solid var(--accent);font:700 46px/1 var(--font-display);letter-spacing:.1em;text-align:center;font-variant-numeric:tabular-nums}

/* ---------- settings ---------- */
.settings section{display:flex;flex-direction:column;gap:12px;padding:6px 10px 18px;border-bottom:1px solid var(--line-soft)}
.settings section:last-child{border-bottom:0}
.settings h3{margin:8px 0 0;font:600 12px var(--font-display);letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;margin:0;font-size:14px}
.kv dt{color:var(--fg-3)}
.kv dd{margin:0;text-align:right;overflow-wrap:anywhere}
.status{display:inline-flex;align-items:center;gap:6px}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.status.warn::before{background:var(--warn)}
.setting{display:flex;flex-direction:column;gap:8px}
.setting > span{font-size:14px;color:var(--fg-2)}
.seg{display:inline-flex;flex-wrap:wrap;gap:3px;padding:3px;border-radius:10px;background:var(--bg);border:1px solid var(--line);align-self:flex-start}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{padding:8px 12px;border-radius:7px;cursor:pointer;font:600 14px/1 var(--font-display);color:var(--fg-2)}
.seg input:checked + label{background:var(--cell-hover);color:var(--fg)}
.seg input:focus-visible + label{outline:2px solid var(--accent)}

'use strict';

/* ================= basics ================= */
const $ = (s, r = document) => r.querySelector(s);
const MIN = 60000, HOUR = 60 * MIN, DAY = 24 * HOUR;

const store = {
  get(k, d) { try { const v = localStorage.getItem('tuner:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');

const icon = (id, cls = '') => `<svg class="i ${cls}"><use href="#i-${id}"/></svg>`;

const savePrefs = () => store.set('prefs', prefs);

const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function fmtTime(ms) {
  const d = new Date(ms), h = d.getHours(), m = d.getMinutes();
  if (prefs.clock24) return pad(h) + ':' + pad(m);

  const diff = Math.round((startOfDay(ms) - startOfDay(Date.now())) / DAY);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Tomorrow';
  if (diff === -1) return 'Yesterday';
  const d = new Date(ms);

}
function fmtDate(ms) { const d = new Date(ms); return `${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`; }

function hash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  const clean = String(name).replace(/^[A-Z]{2,3}\s*[:|]\s*/, '').replace(/[^A-Za-z0-9À-ɏ ]+/g, ' ').trim();
  const w = clean.split(/\s+/).filter(Boolean);
  if (!w.length) return '?';
  return (w.length > 1 ? w[0][0] + w[1][0] : w[0].slice(0, 2)).toUpperCase();

/* ================= demo catalogue (invented channels) ================= */
const TEAMS = ['Harbor FC', 'Meridian United', 'City Hawks', 'Northgate Rovers', 'Valley Athletic', 'Ironbridge Town', 'Coastline SC', 'Stormers'];
const MOVIES = [

}
function demoSchedule(ch) {

  const out = [];

  while (t < to) {

    if (g.movie) {

/* ================= provider wiring ================= */

  epg = new Map(); epgState = new Map(); epgVer = new Map(); epgQueue = [];
  favs = new Set(store.get('fav:' + p.id, []));

  if (S.provider.type === 'xtream' && prefs.epgSource === 'xmltv') loadXmltv();
}

function groupList(id) {
  if (id === 'all') return S.channels.slice();
  if (id === 'fav') return S.channels.filter(c => favs.has(c.id));

}

/* ================= focus + navigation ================= */
function progAt(ch, t) {

  let lo = 0, hi = ps.length - 1;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (ps[m].start <= t) lo = m; else hi = m - 1; }
  const p = ps[lo];
  if (p.start <= t && p.end > t) return p;
  if (p.start > t) return ps[0].start - t < 6 * HOUR ? ps[0] : null;
  const n = ps[lo + 1];
  if (n && n.start - t < 3 * HOUR) return n;

}

}
function moveProg(d) {

  const n = neighbor(ch, p, d);

/* ================= hero + OSD ================= */
function metaHTML(ch, p, now) {

  setProvider(res.playlist, res.channels, res.groups);
  S.backdrop = false;
  if (remember) { savePlaylist(res.playlist); store.set('last', res.playlist.id); }
  startUp();
  if (fromLogin || !loginEl.hidden) closeLogin();
  toast(`Signed in to ${res.playlist.name} · ${res.channels.length.toLocaleString()} channels`);
  return res;
}
let loginCancelable = false;
function openLogin({ cancelable = false, values = null, error = '' } = {}) {
  loginCancelable = cancelable;
  el('loginCancel').hidden = !cancelable;
  el('loginErr').hidden = !error; el('loginErr').textContent = error;
  el('loginInfo').hidden = true;
  if (values) { el('fName').value = values.name || ''; el('fServer').value = values.server || ''; el('fUser').value = values.user || ''; el('fPass').value = values.pass || ''; }
  el('loginNote').textContent = PROXY_ON ? 'Your details stay in this browser and are only sent to your provider.' : 'Preview: sign-in needs the downloadable version. The demo playlist shows every feature here.';
  closeAllLayers();
  exitFull();
  loginEl.hidden = false;
  setTimeout(() => (values ? el('signInBtn') : el('fServer')).focus({ preventScroll: true }), 30);
}
function closeLogin() { loginEl.hidden = true; guideScroll.focus({ preventScroll: true }); }
el('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = el('signInBtn'), err = el('loginErr');
  err.hidden = true;
  const v = { name: el('fName').value.trim(), server: el('fServer').value.trim(), user: el('fUser').value.trim(), pass: el('fPass').value };
  btn.disabled = true;
  const step = s => { btn.textContent = s; };
  try { await connectPlaylist(v, { fromLogin: true, remember: el('fRemember').checked, step }); }
  catch (ex) { err.textContent = ex && ex.user ? ex.message : netError(ex, normalizeServer(v.server).server || v.server).message; err.hidden = false; }
  finally { btn.disabled = false; btn.textContent = 'Sign in'; }
});
function autofillFromLink() {
  const n = normalizeServer(el('fServer').value);
  if (n.user && n.pass) {
    el('fUser').value = n.user; el('fPass').value = n.pass; el('fServer').value = n.server;
    const info = el('loginInfo'); info.textContent = 'Filled in your username and password from the link.'; info.hidden = false;
  }
}
el('fServer').addEventListener('change', autofillFromLink);
el('fServer').addEventListener('paste', () => setTimeout(autofillFromLink, 0));
el('pwToggle').addEventListener('click', () => {
  const f = el('fPass'), show = f.type === 'password';
  f.type = show ? 'text' : 'password';
  el('pwToggle').setAttribute('aria-label', show ? 'Hide password' : 'Show password');
});
el('demoBtn').addEventListener('click', () => {

  else loadDemo(false);
  closeLogin();
});
el('loginCancel').addEventListener('click', closeLogin);

/* ================= drawers, search, details ================= */
const layers = [];
function openLayer(node, focusSel) {
  if (layers.includes(node)) return;
  node.hidden = false; scrim.hidden = false; layers.push(node);
  setTimeout(() => { const f = node.querySelector(focusSel || '.item.sel, .item, input, button:not([data-close])'); if (f) f.focus({ preventScroll: false }); }, 20);
}
function closeLayer() {
  const node = layers.pop();
  if (node) node.hidden = true;
  if (!layers.length) { scrim.hidden = true; guideScroll.focus({ preventScroll: true }); }
}
function closeAllLayers() { while (layers.length) closeLayer(); }
scrim.addEventListener('click', closeAllLayers);
document.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeLayer(); });

function openGroups() {

  h += '<div class="list-label">Categories</div>' + S.groups.map(g => groupItem(g.id, g.name, g.count)).join('');
  el('groupsList').innerHTML = h;

}
const groupItem = (id, name, n) => `<button class="item${S.groupId === id ? ' sel' : ''}" data-group="${esc(id)}">${icon('check', 'mark')}<span class="lbl"><span>${esc(name)}</span></span><span class="n">${n}</span></button>`;

function openSearch() {
  el('searchInput').value = '';
  runSearch('');
  openLayer(el('searchSheet'), 'input');
}
function runSearch(q) {
  q = q.trim().toLowerCase();
  const now = Date.now(), out = [];
  if (!q) {
    const rec = recents.map(id => S.byId.get(id)).filter(Boolean).slice(0, 8);
    if (rec.length) { out.push('<div class="list-label">Recently watched</div>'); rec.forEach(c => out.push(chanResult(c, now))); }
    else out.push('<p class="hint" style="padding:12px">Type a channel name, a number or a program title.</p>');
  } else {
    const chs = S.channels.filter(c => c.name.toLowerCase().includes(q) || String(c.num) === q).slice(0, 25);
    if (chs.length) { out.push('<div class="list-label">Channels</div>'); chs.forEach(c => out.push(chanResult(c, now))); }
    const progs = [];
    for (const c of S.channels) {
      const ps = epg.get(c.id); if (!ps) continue;
      for (const p of ps) { if (p.end > now && p.start < rangeEnd && p.title.toLowerCase().includes(q)) { progs.push([c, p]); if (progs.length > 200) break; } }
      if (progs.length > 200) break;
    }
    progs.sort((a, b) => a[1].start - b[1].start);
    if (progs.length) {
      out.push('<div class="list-label">Programs</div>');
      progs.slice(0, 40).forEach(([c, p]) => out.push(`<button class="item" data-sc="${esc(c.id)}" data-ss="${p.start}">${logoHTML(c, 'sm')}<span class="lbl"><span>${esc(p.title)}</span><span class="sub">${isNowProg(p, now) ? 'On now' : esc(fmtDay(p.start)) + ' ' + fmtTime(p.start)} · ${c.num} ${esc(c.name)}</span></span></button>`));
    }
    if (!chs.length && !progs.length) out.push(`<p class="hint" style="padding:12px">Nothing matches "${esc(q)}".${S.provider.type === 'xtream' ? ' Program search covers the guide data loaded so far.' : ''}</p>`);
  }
  el('searchResults').innerHTML = out.join('');
}
function chanResult(c, now) {
  const p = progAt(c, now);
  return `<button class="item" data-sc="${esc(c.id)}">${logoHTML(c, 'sm')}<span class="lbl"><span>${c.num} · ${esc(c.name)}</span><span class="sub">${p && isNowProg(p, now) ? 'Now: ' + esc(p.title) : 'Live channel'}</span></span></button>`;
}
el('searchInput').addEventListener('input', e => runSearch(e.target.value));
el('searchResults').addEventListener('click', e => {
  const b = e.target.closest('[data-sc]'); if (!b) return;
  const ch = S.byId.get(b.dataset.sc); if (!ch) return;
  closeAllLayers();
  let i = S.list.indexOf(ch);
  if (i < 0) { applyGroup('all'); i = S.list.indexOf(ch); }
  if (b.dataset.ss) {
    const p = (epg.get(ch.id) || []).find(q => q.start === +b.dataset.ss);
    setFocusTo(i, p); focusChanged();
    if (p && !isNowProg(p)) openDetails(ch, p); else play(ch);
  } else { setFocusTo(i, null); focusChanged(); play(ch); }
});

function openDetails(ch, p) {
  const now = Date.now(), live = isNowProg(p, now), cu = canCatchup(ch, p, now);
  let btns = '';
  if (live) btns += `<button class="btn primary" data-d="watch">${icon('play', 'fill')}Watch now</button>`;
  if (cu) btns += `<button class="btn ${live ? 'ghost' : 'primary'}" data-d="catchup">${icon('replay')}Watch from start</button>`;
  if (!live) btns += `<button class="btn ${cu ? 'ghost' : 'primary'}" data-d="watch">${icon('play', 'fill')}Watch channel live</button>`;
  btns += `<button class="btn ghost" data-d="fav">${icon('star', favs.has(ch.id) ? 'fill' : '')}${favs.has(ch.id) ? 'Remove favorite' : 'Add to favorites'}</button>`;
  const past = p.end <= now && !cu ? `<p class="hint">This program has ended${ch.archive ? ' and is older than the catch-up window' : ' and this channel has no catch-up'}.</p>` : '';
  el('progCard').innerHTML = `<div class="info-chan">${logoHTML(ch, 'sm')}<span class="num">${ch.num}</span><span class="name">${esc(ch.name)}</span></div><h2>${esc(p.title)}</h2><div class="info-meta">${metaHTML(ch, p, now)}</div>${p.desc ? `<p>${esc(p.desc)}</p>` : ''}${past}<div class="btns">${btns}</div>`;
  el('progCard').dataset.ch = ch.id; el('progCard').dataset.s = p.start;
  openLayer(el('progModal'), '.btn');
}
el('progCard').addEventListener('click', e => {
  const b = e.target.closest('[data-d]'); if (!b) return;
  const ch = S.byId.get(el('progCard').dataset.ch); if (!ch) return;
  const p = (epg.get(ch.id) || []).find(q => q.start === +el('progCard').dataset.s);
  if (b.dataset.d === 'fav') { toggleFav(ch); if (p) { closeLayer(); openDetails(ch, p); } return; }
  closeAllLayers();
  if (b.dataset.d === 'watch') play(ch, { full: true });
  if (b.dataset.d === 'catchup' && p) play(ch, { full: true, catchup: p });
});
function toggleFav(ch) {
  if (!ch) return;
  if (favs.has(ch.id)) { favs.delete(ch.id); toast(`Removed ${ch.name} from favorites`); }
  else { favs.add(ch.id); toast(`Added ${ch.name} to favorites`); }
  store.set('fav:' + S.provider.id, [...favs]);
  if (S.groupId === 'fav') applyGroup('fav'); else renderGuide();
  updateOsd();
}

rowsEl.addEventListener('click', e => {

let numBuf = '', numTimer = 0;
function numKey(d) {
  numBuf = (numBuf + d).slice(-4);
  numEl.textContent = numBuf; numEl.hidden = false;
  clearTimeout(numTimer);
  numTimer = setTimeout(() => {
    numEl.hidden = true;
    const n = +numBuf; numBuf = '';
    const ch = S.channels.find(c => c.num === n);
    if (!ch) { toast(`There's no channel ${n}`); return; }
    let i = S.list.indexOf(ch);
    if (i < 0) { applyGroup('all'); i = S.list.indexOf(ch); }
    setFocusTo(i, null); focusChanged();
    play(ch);
    if (app.classList.contains('is-full')) showOsd();
  }, 1300);
}
function keyName(e) {
  const k = e.key, kc = e.keyCode;
  if (k === 'ArrowUp' || kc === 38) return 'up';
  if (k === 'ArrowDown' || kc === 40) return 'down';
  if (k === 'ArrowLeft' || kc === 37) return 'left';
  if (k === 'ArrowRight' || kc === 39) return 'right';
  if (k === 'Enter' || kc === 13) return 'ok';
  if (k === 'Escape' || k === 'GoBack' || k === 'BrowserBack' || kc === 10009 || kc === 461) return 'back';
  if (k === 'Backspace') return 'backspace';
  if (k === 'PageUp' || k === 'ChannelUp' || kc === 427) return 'pgup';
  if (k === 'PageDown' || k === 'ChannelDown' || kc === 428) return 'pgdn';
  if (/^[0-9]$/.test(k)) return 'digit';
  if (k === 'f' || k === 'F') return 'fav';
  if (k === '/') return 'search';
  if (k === 'g' || k === 'G') return 'groups';
  if (k === 'i' || k === 'I' || k === 'ContextMenu') return 'info';
  if (k === 'm' || k === 'M') return 'mute';
  return '';
}
function focusables(container) { return [...container.querySelectorAll('.item, .rail-btn')].filter(n => n.offsetParent !== null); }
function moveListFocus(container, d) {
  const items = focusables(container); if (!items.length) return false;
  const i = items.indexOf(document.activeElement);
  const next = items[Math.max(0, Math.min(items.length - 1, i < 0 ? 0 : i + d))];
  next.focus(); return true;
}

const TV = !!window.TUNER_TV;
let kbFor = null;
function isTextInput(n) { return !!n && n.tagName === 'INPUT' && !/^(checkbox|radio|button|submit|range)$/i.test(n.type); }
function showKeyboard(n) { kbFor = n; try { if (window.TunerNative) window.TunerNative.showKeyboard(); } catch (e) {} }
function formFocusables(container) {

    .filter(n => !n.disabled && n.offsetParent !== null);
}
function moveFormFocus(container, d) {
  const items = formFocusables(container); if (!items.length) return null;
  const i = items.indexOf(document.activeElement);
  const next = items[Math.max(0, Math.min(items.length - 1, i < 0 ? 0 : i + d))];

}
function tvNav(k, e, container) {
  const a = document.activeElement;
  if (k === 'up' || k === 'down') { e.preventDefault(); moveFormFocus(container, k === 'down' ? 1 : -1); return true; }
  if (k === 'left' || k === 'right') {
    if (a && (a.tagName === 'BUTTON' || (a.tagName === 'INPUT' && a.type === 'checkbox'))) { e.preventDefault(); moveFormFocus(container, k === 'right' ? 1 : -1); return true; }
    return false;
  }
  if (k === 'ok') {
    if (a && a.tagName === 'INPUT' && a.type === 'checkbox') { e.preventDefault(); a.click(); return true; }
    if (TV && isTextInput(a)) {
      e.preventDefault();
      if (kbFor === a) { kbFor = null; const n = moveFormFocus(container, 1); if (isTextInput(n) && !n.value) showKeyboard(n); }
      else showKeyboard(a);
      return true;
    }
  }
  return false;
}
function searchNav(k, e, top) {
  const a = document.activeElement, input = el('searchInput'), items = focusables(top);
  if (a === input) {
    if (k === 'down' && items.length) { e.preventDefault(); items[0].focus(); }
    else if (k === 'ok' && TV) { e.preventDefault(); if (kbFor === input) { kbFor = null; if (items.length) items[0].focus(); } else showKeyboard(input); }
    return;
  }
  if (k === 'up' || k === 'down') {
    e.preventDefault();
    if (k === 'up' && items.indexOf(a) <= 0) { input.focus(); return; }
    moveListFocus(top, k === 'down' ? 1 : -1);
  }
}

/* Back / Escape: close what's open, return the guide to now, then the menu. Returns false when there's nothing left (the TV app then offers to exit). */
function handleBack() {
  if (!numEl.hidden) { numEl.hidden = true; numBuf = ''; clearTimeout(numTimer); return true; }
  if (!loginEl.hidden) { if (loginCancelable) { closeLogin(); return true; } return false; }
  if (layers.length) { closeLayer(); return true; }
  if (app.classList.contains('is-full')) { exitFull(); return true; }
  const a = document.activeElement;
  if (a && a.closest && a.closest('#rail')) return false;
  const p = focusedProg();
  if (p && !isNowProg(p)) { jumpToNow(false); guideScroll.focus({ preventScroll: true }); return true; }
  const b = document.querySelector('.rail-btn.active') || document.querySelector('.rail-btn');
  if (b && b.offsetParent) { b.focus(); return true; }
  return false;
}
window.tunerBack = handleBack;

document.addEventListener('keydown', e => {
  firstGesture();
  let k = keyName(e); if (!k) return;
  const a = document.activeElement;
  const inField = !!a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
  if (k === 'backspace') { if (inField) return; k = 'back'; }
  if (k === 'back') {
    if (isTextInput(a) && e.key !== 'Escape') return;
    if (handleBack()) e.preventDefault();
    return;
  }
  if (!loginEl.hidden) { tvNav(k, e, el('loginForm')); return; }
  if (app.classList.contains('is-full') && !layers.length) {
    const map = { up: () => stepChannel(-1), down: () => stepChannel(1), pgup: () => stepChannel(-1), pgdn: () => stepChannel(1), left: showOsd, right: showOsd, ok: () => osd.classList.contains('hide') ? showOsd() : osd.classList.add('hide'), info: showOsd, fav: () => { toggleFav(S.byId.get(S.playingId)); showOsd(); }, mute: () => { toggleMute(); showOsd(); } };
    if (k === 'digit') { e.preventDefault(); numKey(e.key); return; }
    if (map[k]) { e.preventDefault(); map[k](); }
    return;
  }
  if (layers.length) {
    const top = layers[layers.length - 1];
    if (top.id === 'searchSheet') searchNav(k, e, top);
    else tvNav(k, e, top);
    return;
  }
  if (inField) return;
  if (a && a.closest && a.closest('#rail')) {
    if (k === 'up' || k === 'down') { e.preventDefault(); moveListFocus(el('rail'), k === 'down' ? 1 : -1); }
    else if (k === 'right') { e.preventDefault(); guideScroll.focus({ preventScroll: true }); }
    return;
  }
  const visRows = Math.max(1, Math.floor((guideScroll.clientHeight - headH) / rowH) - 1);
  switch (k) {
    case 'up': e.preventDefault(); moveRow(-1); break;
    case 'down': e.preventDefault(); moveRow(1); break;
    case 'pgup': e.preventDefault(); moveRow(-visRows); break;
    case 'pgdn': e.preventDefault(); moveRow(visRows); break;
    case 'left': e.preventDefault(); moveProg(-1); break;
    case 'right': e.preventDefault(); moveProg(1); break;
    case 'ok': {
      if (a && a.tagName === 'BUTTON') return;
      e.preventDefault();
      const ch = S.list[focus.i]; if (!ch) return;
      const p = focusedProg();
      if (!p || isNowProg(p)) { if (S.playingId === ch.id && !S.catchup) enterFull(); else play(ch, { full: true }); }
      else openDetails(ch, p);
      break;
    }
    case 'info': { e.preventDefault(); const ch = S.list[focus.i], p = focusedProg(); if (ch && p) openDetails(ch, p); break; }
    case 'digit': e.preventDefault(); numKey(e.key); break;
    case 'fav': e.preventDefault(); toggleFav(S.list[focus.i]); break;
    case 'search': e.preventDefault(); openSearch(); break;
    case 'groups': e.preventDefault(); openGroups(); break;
    case 'mute': e.preventDefault(); toggleMute(); break;
  }
});

/* Stop the stream while the app or tab is in the background (providers limit connections), resume on return. */
document.addEventListener('visibilitychange', () => {
  if (!S.provider || S.provider.type !== 'xtream') return;
  if (document.hidden) { playToken++; teardownStream(); spinner.hidden = true; }
  else { const ch = S.byId.get(S.playingId); if (ch) play(ch, { quiet: true, catchup: S.catchup }); }
});

let toastTimer = 0;
function toast(msg, ms = 2800) {
  toastEl.textContent = msg; toastEl.hidden = false;
  clearTimeout(toastTimer);
  if (ms) toastTimer = setTimeout(() => { toastEl.hidden = true; }, ms);
}

/* ================= clock + resize ================= */
let lastMinute = 0;
function tick() {
  const now = Date.now();
  if (now - rangeStart > 24 * HOUR) {
    computeRange();
    if (S.provider && S.provider.type === 'demo') S.channels.forEach(c => epg.set(c.id, demoSchedule(c)));
    layoutGuide();
  }
  if (focus.follow) { const ch = S.list[focus.i], p = focusedProg(); if (!p || !isNowProg(p, now) || focus.t < now - MIN) focus.t = now; }
  positionNow();
  const m = Math.floor(now / MIN);
  if (m !== lastMinute) { lastMinute = m; invalidateRows(); renderGuide(); }
  updateHero(); updateOsd();
}
let resizeT = 0;
window.addEventListener('resize', () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => {
    const oldPpm = ppm, centerT = rangeStart + (guideScroll.scrollLeft / oldPpm) * MIN;
    layoutGuide();
    guideScroll.scrollLeft = Math.max(0, x(centerT));
    ensureVisible(); renderGuide(); sizeCanvas();
  }, 120);
});

/* ================= boot ================= */
function boot() {
  computeRange(); applyRowSize(); readMetrics();
  const saved = savedPlaylists(), last = store.get('last', null);
  if (last === 'demo') loadDemo(false);
  else {
    loadDemo(true);
    const sp = last && saved.find(p => p.id === last);
    if (sp) {
      toast(`Connecting to ${sp.name}…`, 0);
      connectPlaylist(sp).catch(ex => { toastEl.hidden = true; openLogin({ cancelable: false, values: sp, error: ex.message }); });
    } else openLogin({});
  }
  setInterval(tick, 15000);
  tick();
  if (loginEl.hidden) guideScroll.focus({ preventScroll: true });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { invalidateRows(); renderGuide(); });
}
boot();
})();
</script>
