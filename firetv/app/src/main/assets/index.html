<style>
/* Modern dark dashboard: slate room, rounded cards, a white pill for whatever is selected, soft neon lights behind everything.
   Every color and the font come from the theme (Settings → Themes & look), set as CSS variables by applyLook(). */
:root{
  color-scheme:dark;
  --bg:#161922; --panel:#1f2330; --menu:#1c202c; --rail-bg:transparent; --glass:rgba(31,35,48,.93);
  --cell:#282c39; --cell-now:#2d3242; --cell-hover:#363b4b;
  --line:#2b3040; --line-soft:#242937;
  --fg:#f3f5f9; --fg-2:#a9b0c1; --fg-3:#6e778c;
  --accent:#5ee6c4; --accent-2:#4cc9f0; --accent-ink:#062a21; --accent-soft:rgba(94,230,196,.17); --accent-glow:rgba(94,230,196,.45);
  --hl:#ffffff; --hl-ink:#151821;
  --paper:#f4f6fb; --paper-ink:#161922; --paper-2:#5d6476;
  --glow-a:rgba(76,201,240,.2); --glow-b:rgba(255,107,139,.15);
  --live:#ff5a6e; --ok:#5ee6c4; --warn:#f6c453;
  --font-display:'Poppins',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-body:'Poppins',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-xl:26px; --r-lg:20px; --r-md:14px; --r-sm:10px;
  --railW:228px; --chanW:236px; --rowH:64px; --headH:44px;
}
:root.rows-compact{--rowH:52px}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font-body);-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.fill{fill:currentColor;stroke:none}

/* ---------- room: theme background, neon lights, holiday decorations ---------- */
#bg{position:fixed;top:0;right:0;bottom:0;left:0;z-index:-1;overflow:hidden;pointer-events:none;background:radial-gradient(circle at 4% -6%,var(--glow-a),transparent 44%),radial-gradient(circle at 104% 108%,var(--glow-b),transparent 48%),var(--bg)}
html.no-glow #bg{background:var(--bg)}
.app.is-full ~ #bg,.app.is-full ~ .deco-layer{display:none}
/* decorations float in front of the guide (behind menus and full-screen video), faint enough to read through */
.deco-layer{position:fixed;top:0;right:0;bottom:0;left:0;z-index:45;overflow:hidden;pointer-events:none}
.deco{position:absolute;top:0;right:0;bottom:0;left:0}
.deco i{position:absolute;top:-10%;left:var(--x);width:var(--s);height:var(--s);color:var(--c,#fff);opacity:var(--o,.6);animation:fall var(--d) linear var(--dl) infinite;will-change:transform}
.deco i svg{display:block;width:100%;height:100%;animation:sway calc(var(--d) / 3) ease-in-out var(--dl) infinite alternate}
@keyframes fall{to{transform:translate3d(0,125vh,0)}}
@keyframes sway{from{transform:translateX(calc(var(--sw,14px) * -1)) rotate(-12deg)}to{transform:translateX(var(--sw,14px)) rotate(12deg)}}
.deco.tumble i{perspective:220px}
.deco.tumble i svg{animation:tumble calc(var(--d) / 2.4) linear var(--dl) infinite}
@keyframes tumble{from{transform:translateX(calc(var(--sw,14px) * -1)) rotateX(0deg) rotateY(0deg) rotateZ(0deg)}50%{transform:translateX(var(--sw,14px)) rotateX(calc(var(--tx) / 2)) rotateY(calc(var(--ty) / 2)) rotateZ(calc(var(--r) / 2))}to{transform:translateX(calc(var(--sw,14px) * -1)) rotateX(var(--tx)) rotateY(var(--ty)) rotateZ(var(--r))}}
.deco.rise i{top:auto;bottom:-10%;animation-name:rise}
@keyframes rise{to{transform:translate3d(0,-125vh,0)}}
.deco.fly i{top:var(--y);left:-14%;animation-name:fly}
.deco.fly i svg{animation:flap .3s ease-in-out infinite}
@keyframes fly{0%{transform:translate3d(0,0,0)}25%{transform:translate3d(33vw,-3vh,0)}50%{transform:translate3d(66vw,2vh,0)}75%{transform:translate3d(99vw,-4vh,0)}100%{transform:translate3d(132vw,-1vh,0)}}
@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.32)}}
.deco.burst i{top:var(--y);animation:burst var(--d) ease-out var(--dl) infinite}
.deco.burst i svg{animation:none}
@keyframes burst{0%{transform:scale(.05);opacity:0}6%{opacity:var(--o)}40%{transform:scale(1);opacity:calc(var(--o) * .85)}70%{transform:scale(1.08) translateY(5%);opacity:0}100%{transform:scale(1.08);opacity:0}}
/* theme scenery: backdrop in #bg, frame pieces + vignette in #fx (over the app's edges, never over the guide's text) */
#bg svg{position:absolute;top:0;left:0;width:100%;height:100%;display:block}
html.no-glow #bg svg{display:none}
#fx{position:absolute;top:0;right:0;bottom:0;left:0;--sceneVh:1vh}
html.tv #fx{--sceneVh:var(--vh)}
.fx{position:absolute;pointer-events:none}
.fx svg{display:block;width:100%;height:auto}
.fx-tl{top:0;left:0}.fx-tr{top:0;right:0}.fx-bl{bottom:0;left:0}.fx-br{bottom:0;right:0}
.fx-top,.fx-bottom{left:0;right:0}.fx-top{top:0}.fx-bottom{bottom:0}
.fx-top svg,.fx-bottom svg{height:100%}
.fx-vig{position:absolute;top:0;right:0;bottom:0;left:0;background:radial-gradient(ellipse at center,transparent 58%,var(--vig) 100%)}
.fx-drift{animation:fxdrift 38s ease-in-out infinite alternate;will-change:transform}
@keyframes fxdrift{from{transform:translate3d(-4%,0,0)}to{transform:translate3d(4%,0,0)}}
.fx-blink{animation:fxblink 9s linear infinite}
@keyframes fxblink{0%,30%{opacity:0}34%,62%{opacity:1}63%,64.5%{opacity:0}65.5%,78%{opacity:1}82%,100%{opacity:0}}
html.has-scene .info{background:linear-gradient(90deg,var(--scrim-a),var(--scrim-b) 72%,transparent)}
html.layer-open .deco i,html.layer-open .deco i svg,html.layer-open .fx{animation-play-state:paused}

/* ---------- shell ---------- */
.app{height:100%;display:grid;grid-template-columns:var(--railW) minmax(0,1fr);gap:22px;padding-top:18px;padding-bottom:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px))}
.rail{display:flex;flex-direction:column;gap:4px;min-height:0;padding:4px 6px 4px 4px;border-radius:var(--r-xl);background:var(--rail-bg)}
html.menu-tint .rail{padding:14px 12px}
.brand{display:flex;align-items:center;gap:12px;padding:6px 10px 26px}
.brand-mark{position:relative;flex:none;width:40px;height:40px;border-radius:12px;display:block;background:#151925;box-shadow:0 8px 26px rgba(76,201,240,.18),0 0 0 1px rgba(255,255,255,.08)}
.logo-svg{display:block;width:100%;height:100%;border-radius:inherit;overflow:hidden}
.brand-deco{position:absolute;right:-8px;top:-9px;width:21px;height:21px;color:var(--gc,var(--fg));filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.brand-deco:empty{display:none}
.wordmark{font:600 21px/1 var(--font-display);letter-spacing:-.01em}
.rail-btn{display:flex;align-items:center;gap:14px;min-height:48px;padding:0 16px;border-radius:16px;color:var(--fg-2);font:500 14.5px/1 var(--font-body);white-space:nowrap;transition:background .15s,color .15s}
.rail-btn .i{width:21px;height:21px}
.rail-btn:hover{color:var(--fg);background:rgba(255,255,255,.05)}
.rail-btn.active{background:var(--hl);color:var(--hl-ink);box-shadow:0 10px 28px rgba(0,0,0,.28)}
.rail .spacer{flex:1}
.rail-card{display:flex;align-items:center;gap:12px;margin-top:10px;padding:12px;border-radius:var(--r-lg);background:var(--panel);text-align:left;min-width:0}
.rail-card:hover{background:var(--cell)}
.rail-card .av{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent-2),var(--accent));color:var(--accent-ink);font:700 13px/1 var(--font-display)}
.rail-card .t{min-width:0;display:flex;flex-direction:column;gap:3px}
.rail-card b{font:600 13.5px/1.2 var(--font-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail-card small{font-size:11.5px;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main{display:grid;grid-template-rows:auto minmax(0,1fr);gap:20px;min-width:0;min-height:0}

/* ---------- hero: preview + details (+ up next on wide screens) ---------- */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;height:clamp(200px,34vh,360px);min-height:0}
.stage{position:relative;height:100%;aspect-ratio:16/9;max-width:52vw;border-radius:var(--r-xl);overflow:hidden;background:#000;box-shadow:0 18px 50px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.05)}
.screen{position:absolute;top:0;right:0;bottom:0;left:0;cursor:pointer}
.screen canvas,.screen video{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;display:block;object-fit:contain;background:#000}
.screen-msg{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;text-align:center;background:rgba(10,12,18,.86);font-size:13.5px;color:var(--fg-2)}
.screen-msg b{font:600 17px var(--font-display);color:var(--fg)}
.err-code{font:500 11px var(--font-body);letter-spacing:.04em;color:var(--fg-3)}
.spinner{position:absolute;left:50%;top:50%;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;border:3px solid rgba(255,255,255,.16);border-top-color:var(--accent);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pill{position:absolute;left:12px;bottom:12px;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;background:rgba(10,12,18,.8);font:500 12px var(--font-display);color:var(--fg)}
.pill .i{width:16px;height:16px}
.expand-hint{position:absolute;right:12px;top:12px;padding:7px;border-radius:12px;background:rgba(10,12,18,.6);opacity:0;transition:opacity .2s}
.screen:hover .expand-hint{opacity:1}
.app.is-full .expand-hint{display:none}
.info{display:flex;flex-direction:column;gap:10px;min-width:0;min-height:0;overflow:hidden;padding:20px 24px;border-radius:var(--r-xl);background:var(--panel)}
.info-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.info.blank .logo,.info.blank .progress{visibility:hidden}
.info-chan{display:flex;align-items:center;gap:10px;min-width:0;font:500 14px var(--font-display);color:var(--fg-2)}
.info-chan .num{color:var(--fg-3);font-variant-numeric:tabular-nums}
.info-chan .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{font:600 22px/1 var(--font-display);font-variant-numeric:tabular-nums;color:var(--fg);flex:none}
.info-title{margin:2px 0 0;font:600 clamp(22px,2.3vw,34px)/1.14 var(--font-display);letter-spacing:-.015em;text-wrap:balance;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.info-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;color:var(--fg-2);font-size:13.5px;font-variant-numeric:tabular-nums}
.info-meta .sep{color:var(--fg-3)}
.badge{display:inline-flex;align-items:center;gap:4px;font:600 10.5px/1 var(--font-display);letter-spacing:.06em;text-transform:uppercase;padding:5px 9px;border-radius:99px;background:var(--cell);color:var(--fg-2)}
.badge.live{background:var(--live);color:#fff}
.badge.new{background:var(--accent-soft);color:var(--accent)}
.badge .i{width:12px;height:12px}
.progress{height:6px;border-radius:99px;background:var(--cell);overflow:hidden;max-width:560px}
.progress i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2));box-shadow:0 0 12px var(--accent-glow)}
.info-desc{margin:0;max-width:68ch;color:var(--fg-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.info-next{color:var(--fg-3);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info-next b{color:var(--fg-2);font-weight:500}
/* the one white card: what's on next on the selected channel */
.upnext{display:none;flex-direction:column;gap:12px;min-height:0;overflow:hidden;padding:20px 18px 16px;border-radius:var(--r-xl);background:var(--paper);color:var(--paper-ink)}
.upnext h3{margin:0 2px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;font:600 16px/1.2 var(--font-display)}
.upnext h3 span{font:500 12px var(--font-body);color:var(--paper-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upnext ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;min-height:0}
.upnext li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:1px 12px;align-items:center;padding:10px 12px;border-radius:14px;background:rgba(22,25,34,.06)}
.upnext li.on{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink)}
.upnext time{grid-row:span 2;min-width:44px;font:600 12.5px var(--font-display);font-variant-numeric:tabular-nums}
.upnext b{font:600 13.5px/1.25 var(--font-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upnext small{font-size:11.5px;opacity:.68;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (min-width:1440px){
  :root:not(.tv) .hero{grid-template-columns:auto minmax(0,1fr) 284px}
  :root:not(.tv) .upnext{display:flex}
}

/* ---------- logos ---------- */
.logo{position:relative;flex:none;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;overflow:hidden;font:700 13px/1 var(--font-display);letter-spacing:.02em;color:#fff;background:linear-gradient(135deg,hsl(var(--h,210),46%,42%),hsl(calc(var(--h,210) + 40),46%,27%))}
.logo img{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:contain;background:#11141b;padding:4px}
.logo.sm{width:32px;height:32px;border-radius:10px;font-size:11.5px}

/* ---------- EPG grid ---------- */
.guide{position:relative;min-height:0;border-radius:var(--r-xl);background:var(--panel);overflow:hidden}
.guide-scroll{position:absolute;top:8px;right:8px;bottom:8px;left:8px;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--cell-hover) transparent;outline:none;border-radius:calc(var(--r-xl) - 8px)}
.guide-canvas{position:relative}
.timebar{position:sticky;top:0;z-index:6;display:flex;height:var(--headH);background:var(--panel)}
.corner{position:sticky;left:0;z-index:2;flex:none;width:var(--chanW);height:100%;display:flex;flex-direction:column;justify-content:center;gap:3px;padding:0 14px;background:var(--panel);text-align:left}
.corner:hover .g{color:var(--accent)}
.corner .g{display:flex;align-items:center;gap:6px;max-width:100%;font:600 14px/1.15 var(--font-display)}
.corner .g span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.corner .g .i{width:14px;height:14px;color:var(--fg-3)}
.corner .d{font:500 11.5px/1 var(--font-body);color:var(--fg-3)}
.ticks{position:relative;flex:none;height:100%;overflow:hidden}
.tick{position:absolute;top:0;height:100%;display:flex;align-items:center;padding-left:10px;font:500 12.5px/1 var(--font-body);font-variant-numeric:tabular-nums;color:var(--fg-3);white-space:nowrap}
.tick::before{content:"";position:absolute;left:0;top:50%;width:1px;height:12px;margin-top:-6px;background:var(--line)}
.tick.covered{visibility:hidden}
.tick.day{color:var(--fg)}
.tick.day b{font-weight:600;color:var(--accent);margin-right:6px}
.now-tick{position:absolute;top:50%;z-index:1;transform:translate(-50%,-50%);padding:5px 10px;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2));color:var(--accent-ink);font:600 11px/1 var(--font-display);font-variant-numeric:tabular-nums;white-space:nowrap;box-shadow:0 0 16px var(--accent-glow)}
.rows{position:relative}
.row{position:absolute;left:0;display:flex;height:var(--rowH)}
.chan{position:sticky;left:0;z-index:4;flex:none;width:var(--chanW);height:100%;display:flex;align-items:center;gap:11px;padding:0 14px 0 10px;background:var(--panel);cursor:pointer;min-width:0}
.chan::before{content:"";position:absolute;top:3px;right:6px;bottom:3px;left:0;z-index:-1;border-radius:var(--r-md);background:var(--cell)}
.chan:hover::before{background:var(--cell-hover)}
.chan.cur::before{background:var(--cell-hover);box-shadow:inset 3px 0 0 var(--accent)}
.cnum{width:calc(var(--nd, 3) * 1ch + 1px);flex:none;text-align:right;white-space:nowrap;font:600 13px/1 var(--font-display);font-variant-numeric:tabular-nums;color:var(--fg-3)}
.chan.cur .cnum,.chan.playing .cnum{color:var(--accent)}
.cname{flex:1;min-width:0;font:500 14px/1.2 var(--font-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chan .star{width:14px;height:14px;color:var(--warn);flex:none}
.eq{display:flex;align-items:flex-end;gap:2px;height:13px;flex:none}
.eq i{width:3px;height:100%;background:var(--accent);border-radius:2px;transform-origin:bottom;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.35s}.eq i:nth-child(3){animation-delay:-.7s}
@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.progs{position:relative;flex:none;height:100%}
.prog{position:absolute;top:3px;bottom:3px;margin-left:3px;overflow:hidden;border-radius:var(--r-md);background:var(--cell);padding:0 14px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:4px;cursor:pointer;user-select:none}
.prog:hover{background:var(--cell-hover)}
.prog.now{background:var(--cell-now)}
.prog .pt,.prog .ps{position:relative;margin-left:var(--shift,0px);max-width:calc(100% - var(--shift,0px));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog .pt{font:500 14px/1.2 var(--font-display);color:var(--fg)}
.prog .ps{font-size:11.5px;line-height:1;color:var(--fg-3);font-variant-numeric:tabular-nums}
.prog.past .pt{color:var(--fg-2)}
.prog .lv{display:inline-block;margin-right:7px;padding:3px 6px 2px;border-radius:99px;background:var(--live);color:#fff;font:600 9.5px/1 var(--font-display);letter-spacing:.06em;vertical-align:2px}
.prog .cu{width:13px;height:13px;margin-right:5px;vertical-align:-2px;color:var(--fg-2)}
.prog .pb{position:absolute;left:0;top:0;bottom:0;max-width:100%;background:linear-gradient(90deg,transparent,var(--accent-soft));box-shadow:inset 0 -3px 0 var(--accent)}
.prog.focus,.prog.focus:hover{background:var(--hl);box-shadow:0 10px 28px rgba(0,0,0,.35)}
.prog.focus .pt,.prog.focus .ps,.prog.focus .cu{color:var(--hl-ink)}
.prog.focus .ps{opacity:.7}
.prog.focus .pb{background:linear-gradient(90deg,transparent,rgba(0,0,0,.07))}
.prog.tiny{padding:0}
.prog.tiny .pt,.prog.tiny .ps{display:none}
.prog.empty{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.prog.empty .pt{color:var(--fg-3);font-weight:400}
.prog.empty.focus{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.prog.empty.focus .pt{color:var(--fg)}
.nowline{position:absolute;top:var(--headH);bottom:0;z-index:3;width:2px;margin-left:-1px;border-radius:2px;background:linear-gradient(var(--accent),var(--accent-2));box-shadow:0 0 14px var(--accent-glow);pointer-events:none}
.guide-empty{position:absolute;top:var(--headH);right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:24px;text-align:center;color:var(--fg-2)}
.guide-empty b{font:600 19px var(--font-display);color:var(--fg)}

/* ---------- fullscreen ---------- */
.app.is-full .stage{position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;max-width:none;width:auto;height:auto;aspect-ratio:auto;border-radius:0;box-shadow:none}
.app.is-full .screen{cursor:default}
.osd{display:none;position:absolute;left:max(24px,env(safe-area-inset-left,0px));right:max(24px,env(safe-area-inset-right,0px));bottom:max(24px,env(safe-area-inset-bottom,0px));z-index:2;flex-direction:column;gap:10px;padding:22px 26px;border-radius:var(--r-xl);background:var(--glass);box-shadow:0 24px 70px rgba(0,0,0,.5);transition:opacity .25s,transform .25s}
.app.is-full .osd{display:flex}
.osd.hide{opacity:0;transform:translateY(14px);pointer-events:none}
.osd-top{display:flex;align-items:center;gap:12px;font:600 16px var(--font-display)}
.osd-top .num{color:var(--accent);font-variant-numeric:tabular-nums}
.osd-top .name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.osd-top .clock{font-size:22px}
.osd-now{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.osd-title{font:600 clamp(22px,2.8vw,38px)/1.1 var(--font-display);letter-spacing:-.01em;text-wrap:balance}
.osd-time{color:var(--fg-2);font-variant-numeric:tabular-nums}
.osd .progress{max-width:none}
.osd-next{color:var(--fg-2)}
.osd-next b{color:var(--fg-3);font:600 11px var(--font-display);letter-spacing:.08em;text-transform:uppercase;margin-right:8px}
.osd-ctrls{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.osd-btn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:99px;background:rgba(255,255,255,.08);font:500 14px var(--font-display)}
.osd-btn:hover{background:rgba(255,255,255,.16)}
.osd-btn.on .i{color:var(--warn)}
.osd-live{display:inline-flex;align-self:flex-start;align-items:center;gap:8px;padding:6px 12px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font:600 12.5px var(--font-display)}
html.tv .osd-live{font-size:var(--t-xs);padding:calc(var(--vh)*.8) calc(var(--vh)*1.6)}
.cu-flag{position:absolute;top:max(18px,env(safe-area-inset-top,0px));left:max(18px,env(safe-area-inset-left,0px));z-index:2;display:none;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font:600 12px var(--font-display);letter-spacing:.04em}

/* ---------- overlays ---------- */
.scrim{position:fixed;top:0;right:0;bottom:0;left:0;z-index:60;background:rgba(5,7,12,.55)}
.drawer{position:fixed;top:12px;bottom:12px;z-index:61;width:min(400px,calc(100% - 24px));display:flex;flex-direction:column;overflow:hidden;background:var(--menu);border-radius:var(--r-xl);box-shadow:0 30px 90px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.05);animation:inL .22s ease-out}
.drawer.left{left:max(12px,env(safe-area-inset-left,0px))}
.drawer.right{right:max(12px,env(safe-area-inset-right,0px));animation-name:inR}
.drawer.wide{width:min(520px,calc(100% - 24px))}
@keyframes inL{from{transform:translateX(-24px);opacity:0}}
@keyframes inR{from{transform:translateX(24px);opacity:0}}
.drawer header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 22px 12px}
.drawer h2{margin:0;font:600 22px/1.15 var(--font-display);letter-spacing:-.01em}
.icon-btn{display:grid;place-items:center;flex:none;width:40px;height:40px;border-radius:12px;color:var(--fg-2);background:var(--cell)}
.icon-btn:hover{background:var(--cell-hover);color:var(--fg)}
.list{flex:1;min-height:0;overflow:auto;padding:4px 12px 18px;display:flex;flex-direction:column;gap:3px;scrollbar-width:thin;scrollbar-color:var(--cell-hover) transparent}
.item{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:9px 14px;border-radius:var(--r-md);color:var(--fg-2);text-align:left}
.item:hover{background:var(--cell);color:var(--fg)}
.item:focus-visible{outline:none;background:var(--hl);color:var(--hl-ink)}
html.tv .item:focus{outline:none;background:var(--hl);color:var(--hl-ink)}
.item:focus-visible .n,.item:focus-visible .sub,.item:focus-visible .i{color:var(--hl-ink)}
html.tv .item:focus .n,html.tv .item:focus .sub,html.tv .item:focus .i{color:var(--hl-ink)}
.item.sel{color:var(--fg);background:var(--cell)}
.item.sel .mark{color:var(--accent)}
.item .mark{width:18px;height:18px;flex:none;color:transparent}
.item .lbl{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .lbl > span:first-child{font:500 15px/1.25 var(--font-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sub{font-size:12.5px;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .n{margin-left:auto;font:500 13px var(--font-display);font-variant-numeric:tabular-nums;color:var(--fg-3)}
.item .star.fill{color:var(--warn)}
.list-label{padding:16px 14px 6px;font:600 11px var(--font-display);letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3)}
.drawer-foot{padding:14px 22px 22px;display:flex;flex-direction:column;gap:10px}
.share-url{padding:14px 16px;border-radius:var(--r-md);background:var(--bg);font:600 var(--t-l,22px)/1.2 ui-monospace,Menlo,Consolas,monospace;color:var(--accent);word-break:break-all}
.share-code{font:700 calc(var(--t-l,22px) * 1.6)/1 var(--font-display);letter-spacing:.12em;color:var(--fg)}
.pl-row{display:flex;align-items:center;gap:6px}
.item.moving{box-shadow:inset 0 0 0 2px var(--accent)}
html.tv .item.moving:focus{background:var(--accent);color:#0b1020;box-shadow:none}
html.tv .item.moving:focus .n,html.tv .item.moving:focus .i{color:#0b1020}
/* stream details: resolution, frame rate, codecs, audio */
.stream-info{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.stream-info span{padding:3px 8px;border-radius:7px;background:rgba(255,255,255,.1);font:600 11.5px/1.3 var(--font-display);letter-spacing:.02em;color:var(--fg);white-space:nowrap}
.stream-info span.q{background:var(--accent);color:#0b1020}
html.tv .stream-info{gap:calc(var(--vh)*.8)}
html.tv .stream-info span{padding:calc(var(--vh)*.4) calc(var(--vh)*1.1);border-radius:calc(var(--vh)*.9);font-size:calc(var(--vh)*1.9)}
.tb-top .stream-info{margin-left:2px}
.osd .stream-info{margin-top:2px}
/* channel options (hold OK on a channel) */
.ch-menu{gap:0;padding:0;overflow:hidden;width:min(560px,100%)}
.ch-menu .cm-head{display:flex;align-items:center;gap:12px;padding:20px 22px 14px}
.ch-menu .cm-head .num{color:var(--accent);font:600 15px var(--font-display);font-variant-numeric:tabular-nums}
.ch-menu .cm-head b{display:block;font:600 18px/1.2 var(--font-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-menu .cm-head small{display:block;color:var(--fg-2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-menu .cm-head > span:last-child{min-width:0;flex:1}
.ch-menu .list{max-height:min(70vh,560px);padding-top:4px}
html.tv .ch-menu{width:min(calc(var(--vh)*96),100%)}
html.tv .ch-menu .cm-head{gap:calc(var(--vh)*1.6);padding:calc(var(--vh)*3.4) calc(var(--vh)*3.6) calc(var(--vh)*1.6)}
html.tv .ch-menu .cm-head .logo{width:calc(var(--vh)*6.4);height:calc(var(--vh)*6.4);border-radius:calc(var(--vh)*1.7);font-size:var(--t-xs)}
html.tv .ch-menu .cm-head .num{font-size:var(--t-s)}
html.tv .ch-menu .cm-head b{font-size:var(--t-l)}
html.tv .ch-menu .cm-head small{font-size:var(--t-xs)}
html.tv .ch-menu .list{max-height:calc(var(--vh)*66)}
.ask-card h2{margin:0;font:600 20px var(--font-display)}
html.tv .ask-card h2{font-size:var(--t-l)}
.pl-row .item{flex:1;min-width:0}
.pl-row .icon-btn{flex:none}
.search{position:fixed;left:50%;top:max(24px,env(safe-area-inset-top,0px));z-index:61;width:min(700px,calc(100% - 32px));max-height:calc(100% - 48px);transform:translateX(-50%);display:flex;flex-direction:column;background:var(--menu);border-radius:var(--r-xl);overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.05)}
.search-bar{display:flex;align-items:center;gap:12px;margin:12px;padding:6px 6px 6px 16px;border-radius:var(--r-lg);background:var(--cell)}
.search-bar input{flex:1;min-width:0;height:44px;border:0;background:transparent;font-size:17px;outline:none}
.search-bar .i{color:var(--fg-3)}
.search-bar .icon-btn{background:transparent}
.modal{position:fixed;top:0;right:0;bottom:0;left:0;z-index:62;display:grid;place-items:center;padding:16px;pointer-events:none}
.modal-card{pointer-events:auto;width:min(580px,100%);max-height:100%;overflow:auto;background:var(--menu);border-radius:var(--r-xl);padding:28px;display:flex;flex-direction:column;gap:12px;box-shadow:0 30px 90px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.05)}
.modal-card h2{margin:0;font:600 28px/1.12 var(--font-display);letter-spacing:-.015em;text-wrap:balance}
.modal-card p{margin:0;color:var(--fg-2)}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:var(--r-md);font:600 14.5px var(--font-display);white-space:nowrap}
.btn .i{width:18px;height:18px}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink);box-shadow:0 10px 26px var(--accent-soft)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:var(--cell);color:var(--fg)}
.btn.ghost:hover{background:var(--cell-hover)}
.btn.danger{background:transparent;color:#ff9aa7;box-shadow:inset 0 0 0 1px rgba(255,90,110,.45)}
.btn.danger.armed{background:var(--live);color:#fff}
.btn:disabled{opacity:.6;cursor:progress}
.toast{position:fixed;left:50%;bottom:max(24px,calc(env(safe-area-inset-bottom,0px) + 16px));z-index:95;transform:translateX(-50%);max-width:calc(100% - 32px);padding:12px 20px;border-radius:99px;background:var(--paper);color:var(--paper-ink);box-shadow:0 14px 40px rgba(0,0,0,.45);font-size:13.5px;font-weight:500}
.numentry{position:fixed;top:max(24px,env(safe-area-inset-top,0px));right:max(24px,env(safe-area-inset-right,0px));z-index:96;min-width:110px;padding:12px 22px;border-radius:var(--r-lg);background:var(--menu);box-shadow:0 0 0 2px var(--accent),0 0 30px var(--accent-glow);font:600 44px/1 var(--font-display);letter-spacing:.08em;text-align:center;font-variant-numeric:tabular-nums}

/* ---------- settings, themes, channel editor ---------- */
.settings section{display:flex;flex-direction:column;gap:12px;padding:6px 10px 20px;border-bottom:1px solid var(--line-soft)}
.settings section:last-child{border-bottom:0}
.settings h3{margin:10px 0 0;font:600 11.5px var(--font-display);letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;margin:0;font-size:13.5px}
.kv dt{color:var(--fg-3)}
.kv dd{margin:0;text-align:right;overflow-wrap:anywhere}
.status{display:inline-flex;align-items:center;gap:6px}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.status.warn::before{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.setting{display:flex;flex-direction:column;gap:8px}
.setting > span{font-size:13.5px;color:var(--fg-2)}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:var(--r-md);background:var(--bg);align-self:flex-start}
.seg input,.tiles input,.swatches input{position:absolute;opacity:0;pointer-events:none}
.seg label{padding:9px 14px;border-radius:10px;cursor:pointer;font:500 13.5px/1 var(--font-display);color:var(--fg-2)}
.seg input:checked + label{background:var(--hl);color:var(--hl-ink)}
.seg input:focus-visible + label{outline:2px solid var(--accent);outline-offset:2px}
html.tv .seg input:focus + label{outline:2px solid var(--accent);outline-offset:2px}
.seg input:disabled + label{opacity:.45;cursor:not-allowed}
.seg.fonts label{font-size:15px;padding:10px 15px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:8px;padding:8px 8px 10px;border-radius:var(--r-md);background:var(--cell);cursor:pointer;font:500 12.5px/1.2 var(--font-display);color:var(--fg-2)}
.tile .pv{position:relative;display:block;height:60px;border-radius:10px;overflow:hidden;background:radial-gradient(circle at 0 0,var(--ga),transparent 62%),radial-gradient(circle at 100% 100%,var(--gb),transparent 62%),var(--tb)}
.tile .pv::before{content:"";position:absolute;left:7px;top:7px;bottom:7px;width:15%;border-radius:6px;background:var(--tp)}
.tile .pv::after{content:"";position:absolute;left:calc(15% + 13px);right:7px;top:7px;height:11px;border-radius:6px;background:var(--th)}
.tile .pv i{position:absolute;left:calc(15% + 13px);right:7px;bottom:7px;height:20px;border-radius:6px;background:var(--tp);overflow:hidden}
.tile .pv i::after{content:"";position:absolute;left:0;bottom:0;width:62%;height:100%;background:linear-gradient(90deg,transparent,var(--ta));opacity:.55;box-shadow:inset 0 -3px 0 var(--ta)}
.tile .pv svg{position:absolute;right:5px;top:22px;width:16px;height:16px;color:var(--gl)}
.tiles input:checked + .tile{background:var(--hl);color:var(--hl-ink)}
.tiles input:focus-visible + .tile{outline:2px solid var(--accent);outline-offset:2px}
html.tv .tiles input:focus + .tile{outline:2px solid var(--accent);outline-offset:2px}
.swatches{display:flex;flex-wrap:wrap;gap:12px}
.sw{position:relative;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--c);cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.sw.auto{background:conic-gradient(var(--accent),var(--accent-2),var(--hl),var(--accent));}
.sw .i{width:18px;height:18px;color:var(--k,#151821);opacity:0}
.swatches input:checked + .sw{box-shadow:0 0 0 3px var(--menu),0 0 0 5px var(--fg)}
.swatches input:checked + .sw .i{opacity:1}
.swatches input:focus-visible + .sw{outline:2px solid var(--accent);outline-offset:7px}
html.tv .swatches input:focus + .sw{outline:2px solid var(--accent);outline-offset:7px}
.text-in{height:44px;padding:0 14px;border-radius:12px;border:0;box-shadow:inset 0 0 0 1px var(--line);background:var(--bg);font-size:14px;width:100%}
.text-in:focus{outline:none;box-shadow:inset 0 0 0 2px var(--accent),0 0 0 4px var(--accent-soft)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:13.5px;color:var(--fg-2)}
kbd{display:inline-block;min-width:24px;padding:4px 7px;border-radius:7px;background:var(--cell);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25);font:600 11.5px/1 var(--font-display);color:var(--fg);text-align:center}
.hint{font-size:12.5px;color:var(--fg-3);margin:0}
.mgr-tools{display:flex;flex-direction:column;gap:12px;padding:0 22px 12px}
.mgr-tools .hint{margin-top:-2px}
.mrow{display:flex;align-items:center;gap:6px}
.mrow .item{flex:1;min-width:0}
.mrow .grip{color:var(--fg-3)}

.tb-now{position:absolute;top:calc(var(--vh)*-.9);bottom:calc(var(--vh)*-.9);width:calc(var(--vh)*.4);margin-left:calc(var(--vh)*-.2);border-radius:99px;background:#e5383b}
.tb-head{position:absolute;top:50%;width:calc(var(--vh)*2.4);height:calc(var(--vh)*2.4);margin:calc(var(--vh)*-1.2) 0 0 calc(var(--vh)*-1.2);border-radius:50%;background:var(--fg);box-shadow:0 0 0 calc(var(--vh)*.45) rgba(0,0,0,.4)}
.tb-scrub:focus{box-shadow:0 0 0 calc(var(--vh)*.35) rgba(255,255,255,.25)}
.tb-scrub:focus .tb-head{width:calc(var(--vh)*3);height:calc(var(--vh)*3);margin:calc(var(--vh)*-1.5) 0 0 calc(var(--vh)*-1.5);background:var(--hl);box-shadow:0 0 0 calc(var(--vh)*.5) rgba(0,0,0,.45),0 0 calc(var(--vh)*2) var(--hl)}
.tb-head span{position:absolute;bottom:calc(100% + var(--vh)*1.2);left:50%;transform:translateX(-50%);padding:calc(var(--vh)*.6) calc(var(--vh)*1.3);border-radius:calc(var(--vh)*1);background:var(--hl);color:var(--hl-ink);font:600 var(--t-xs) var(--font-display);white-space:nowrap;font-variant-numeric:tabular-nums;display:none}
.tvbar.scrubbing .tb-head span,.tb-scrub:focus .tb-head span{display:block}
.tb-btns{display:flex;flex-wrap:wrap;gap:calc(var(--vh)*1);margin-top:calc(var(--vh)*1)}
.tb-btn{display:inline-flex;align-items:center;gap:calc(var(--vh)*1);height:calc(var(--vh)*5.8);padding:0 calc(var(--vh)*2.1);border-radius:99px;background:rgba(255,255,255,.08);font:500 var(--t-s) var(--font-display);color:var(--fg);transition:none}
.tb-btn .i{width:var(--t-m);height:var(--t-m)}
.tb-btn:focus{outline:none;background:var(--hl);color:var(--hl-ink)}
.tb-btn.dim{opacity:.5}
.tb-btn.on .i{color:var(--warn,#f6c453)}
.tb-btn.on:focus .i{color:inherit}
.tb-hint{font-size:var(--t-xs);color:var(--fg-3)}
/* aspect ratio for the browser's video element (the Fire TV app sizes its own player) */
.screen[data-ar="zoom"] video{object-fit:cover}
.screen[data-ar="stretch"] video{object-fit:fill}
.screen[data-ar="16:9"] video,.screen[data-ar="4:3"] video{object-fit:fill;top:50%;left:50%;right:auto;bottom:auto;width:var(--arw,100%);height:var(--arh,100%);transform:translate(-50%,-50%)}
/* TV: snappy and light. Highlights switch instantly, shadows stay small, sliding panels get their own GPU layer. */
html.tv .item,html.tv .tvnav-item,html.tv .rail-btn,html.tv .mini,html.tv .poster,html.tv .btn,html.tv .chan,html.tv .prog,html.tv .tvch,html.tv .icon-btn{transition:none}
html.tv .drawer,html.tv .tvnav,html.tv .tvopts,html.tv .tvchans,html.tv .modal-card{box-shadow:0 14px 40px rgba(0,0,0,.5)}
html.tv .drawer,html.tv .tvnav{animation-duration:.14s}
html.tv .tvopts,html.tv .tvchans{animation-duration:.12s}
html.tv .osd,html.tv .vosd{box-shadow:0 14px 40px rgba(0,0,0,.45)}
html.tv .prog.focus{box-shadow:none}
html.tv .fx-drift{animation:none}
html.native-video,html.native-video body{background:transparent}
html.native-video .stage{background:transparent}
html.native-video .app.is-full .stage{background:transparent;box-shadow:none}
/* full screen: the page is see-through over the video, so everything but the player and its overlays steps aside */
html.native-video .app.is-full{visibility:hidden}
html.native-video .app.is-full .stage{visibility:visible}
html.native-video .screen video{display:none!important}
/* preview of the TV app in a browser: the whole app drawn inside a 16:9 frame */
#tvFrame{position:fixed;width:960px;height:540px;transform-origin:0 0;overflow:hidden;background:var(--bg);box-shadow:0 0 0 1px var(--line),0 30px 90px rgba(0,0,0,.6)}
@media (prefers-reduced-motion:reduce){
  .eq i,.spinner{animation-duration:3s}
  .drawer,.tvnav,.tvopts,.tvchans{animation:none}
  .osd{transition:none}
  .deco{display:none}
}
</style>

'use strict';

/* ================= basics ================= */
const $ = (s, r = document) => r.querySelector(s);
const MIN = 60000, HOUR = 60 * MIN, DAY = 24 * HOUR;
// Never runs inside someone else's page (no clickjacking of the website).
if (window.top !== window.self) { document.documentElement.textContent = ''; throw new Error('Nightdial does not run inside other pages'); }
const PROXY_ON = !!window.NIGHTDIAL_PROXY;
const TV_MODE = !!window.NIGHTDIAL_TV;
const PREVIEW_TV = !!window.NIGHTDIAL_TV_PREVIEW;
// The sample "demo" playlist only exists in preview pages; the real apps start blank until you add a playlist.
const DEMO_OK = !!window.NIGHTDIAL_DEMO;
if (TV_MODE) document.documentElement.classList.add('tv');
// Fire TV app: video is drawn by Android's own player underneath the page (plays Dolby audio, H.265 and raw TS).
const NATIVE = (() => { try { return !!(window.NightdialNative && window.NightdialNative.hasPlayer && window.NightdialNative.hasPlayer()); } catch (e) { return false; } })();
if (NATIVE) document.documentElement.classList.add('native-video');
if (PREVIEW_TV) {
  // Browser preview of the TV app: draw everything inside a 960x540 "screen" scaled to fit.
  const frame = document.createElement('div');
  frame.id = 'tvFrame';
  while (document.body.firstChild) frame.appendChild(document.body.firstChild);
  document.body.appendChild(frame);
  document.documentElement.style.setProperty('--vh', '5.4px');
  const fit = () => {
    const k = Math.min(window.innerWidth / 960, window.innerHeight / 540);
    frame.style.transform = 'scale(' + k + ')';
    frame.style.left = Math.max(0, (window.innerWidth - 960 * k) / 2) + 'px';
    frame.style.top = Math.max(0, (window.innerHeight - 540 * k) / 2) + 'px';
  };
  window.addEventListener('resize', fit);
  fit();
}
const via = u => PROXY_ON ? '/proxy?u=' + encodeURIComponent(u) + (PO.ua && !window.NIGHTDIAL_TV ? '&ua=' + encodeURIComponent(PO.ua) : '') : u;
// The Nightdial website serves its own copies of the video players; the computer version gets these exact files from jsDelivr.
const HLS_SRC = window.NIGHTDIAL_SITE ? 'lib/hls.min.js' : 'https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js';
const MPEGTS_SRC = window.NIGHTDIAL_SITE ? 'lib/mpegts.js' : 'https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js';
const SITE = !!window.NIGHTDIAL_SITE;
// http IPTV servers can't be reached from a secure (https) web page: browsers block it.
const blockedHere = u => SITE && location.protocol === 'https:' && /^http:/i.test(String(u || '').trim().replace(/^(?!https?:)/i, 'http://'));
const BLOCKED_MSG = host => `${host} uses http, which web browsers block on secure pages. Use the Fire TV or iPhone app, or the computer version from the Nightdial website.`;
const reduceMotion = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };

// Playlists and settings saved by earlier versions move to the current key names, once.
try {
  if (!localStorage.getItem('nightdial:moved')) {
    const legacy = 'tuner:';
    Object.keys(localStorage).filter(k => k.startsWith(legacy)).forEach(k => {
      const nk = 'nightdial:' + k.slice(legacy.length);
      if (localStorage.getItem(nk) == null) localStorage.setItem(nk, localStorage.getItem(k));
      localStorage.removeItem(k);
    });
    localStorage.setItem('nightdial:moved', '1');
  }
} catch (e) {}
const store = {
  get(k, d) { try { const v = localStorage.getItem('nightdial:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('nightdial:' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem('nightdial:' + k); } catch (e) {} }
};
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const enc = encodeURIComponent;
const icon = (id, cls = '') => `<svg class="i ${cls}"><use href="#i-${id}"/></svg>`;

const defaultClock24 = (() => { try { const hc = new Intl.DateTimeFormat(undefined, { hour: 'numeric' }).resolvedOptions().hourCycle; return hc === 'h23' || hc === 'h24'; } catch (e) { return false; } })();
const LOOK_DEFAULTS = { theme: 'midnight', hl: 'auto', menu: 'auto', font: 'poppins', autoSeason: false, deco: true, glow: true, size: 's' };
/* Interface size: [id, label, TV scale, browser scale]. "Smaller" is the default so the guide shows more channels and more hours. */
const SIZES = [['xs', 'Smallest', .74, .82], ['s', 'Smaller', .86, .9], ['m', 'Standard', 1, 1], ['l', 'Larger', 1.14, 1.1]];
const uiScale = () => { const z = SIZES.find(x => x[0] === prefs.size) || SIZES[1]; return TV_MODE ? z[2] : z[3]; };
const prefs = Object.assign({ clock24: defaultClock24, rows: 'comfortable', format: 'auto', aspect: '16:9', player: 'builtin', vpnAuto: false, vpnRequired: false, startFull: true, epgSource: 'provider', xmltvUrl: '', sort: 'provider' }, LOOK_DEFAULTS, store.get('prefs', {}));
const savePrefs = () => store.set('prefs', prefs);
// Stream format now defaults to "Best": the provider's original stream when the device can play it.
if (!prefs.fmtV2) { prefs.format = 'auto'; prefs.fmtV2 = true; savePrefs(); }
const ASPECTS = [['16:9', '16:9'], ['fit', 'Fit'], ['zoom', 'Zoom'], ['stretch', 'Stretch'], ['4:3', '4:3']];
/* Options kept for each playlist (Playlist options). A new playlist starts from the choices made before options were per playlist. */
const PL_DEFAULTS = { format: 'auto', sort: 'provider', epgSource: 'provider', xmltvUrl: '', epgShift: 0, numbers: 'provider', startOn: 'last', vod: true, hideAdult: false, ua: '' };
let PO = Object.assign({}, PL_DEFAULTS);
const plOptsFor = id => Object.assign({}, PL_DEFAULTS, { format: prefs.format, sort: prefs.sort, epgSource: prefs.epgSource, xmltvUrl: prefs.xmltvUrl }, store.get('plopts:' + id, {}));
const savePO = () => { if (S.provider && S.provider.type !== 'none') store.set('plopts:' + S.provider.id, PO); };
const aspectLabel = () => (ASPECTS.find(a => a[0] === prefs.aspect) || ASPECTS[0])[1];

/* ================= look: themes, highlight + menu colors, fonts, holiday decorations ================= */
const THEMES = [
  { id: 'midnight', name: 'Midnight', bg: '#161922', panel: '#1f2330', accent: '#5ee6c4', accent2: '#4cc9f0', glowA: '#4cc9f0', glowB: '#ff6b8b' },

  { id: 'ocean', name: 'Ocean', bg: '#0c1622', panel: '#14222f', accent: '#4cc9f0', accent2: '#5ee6c4', glowA: '#2f8cff', glowB: '#2ee6d6' },

  { id: 'rose', name: 'Rosé', bg: '#1a1216', panel: '#271c22', accent: '#ff8fab', accent2: '#ffc29e', glowA: '#ff6b8b', glowB: '#ffb38a', hl: '#fff1f4' },
  { id: 'classic', name: 'Classic', bg: '#0a0f15', panel: '#0f1720', accent: '#f5a83c', accent2: '#f7c46c', hl: '#f5a83c' },
  { id: 'newyear', name: 'New Year', season: 1, bg: '#0a0a14', panel: '#161628', accent: '#f5d06f', accent2: '#e2e4ff', glowA: '#f5d06f', glowB: '#8b8cff', deco: 'goldfw', glyph: 'spark', gc: '#f5d06f' },

   OK or a short pause jumps there: within what the stream keeps, or with the provider's catch-up for channels that have it. */

/* Where playback is on the clock, and how far back and forward it can go. */
function timeline() {
  const ch = S.byId.get(S.playingId), now = Date.now();

  if (S.catchup && !S.catchup.ts) {        // a recorded program: the whole program can be scrubbed
    const p = S.catchup, len = p.end - p.start;
    const pos = demo ? Math.min(p.end, p.start + (now - p.playedAt)) : p.start + Math.min(len, st.pos * 1000);
    return { kind: 'catchup', min: p.start, max: p.end - 5000, pos, behind: 0, paused: st.paused, can: true };
  }
  let pos;
  if (S.catchup && S.catchup.ts) pos = Math.min(now, demo ? S.catchup.start + (now - S.catchup.playedAt) : S.catchup.start + st.pos * 1000);
  else if (st.behind != null) pos = now - st.behind * 1000;
  else pos = L.pausedAt || now;
  const dvr = !S.catchup && st.seekable && st.dur > 30 ? now - st.dur * 1000 : null;
  let min = now;
  if (ch && canTimeshift(ch)) min = now - (ch.archiveDays || 1) * DAY + HOUR;
  else if (dvr) min = dvr;
  else if (S.catchup && st.seekable) min = S.catchup.start;
  return { kind: S.catchup ? 'timeshift' : 'live', min: Math.min(min, pos), max: now, pos, dvr, behind: Math.max(0, (now - pos) / 1000), paused: st.paused || !!L.pausedAt, can: min < now - 20000 };
}
function openTvBar() {

    bar.hidden = false;
  }

  renderTvBar();

}

/* Stays up while you use it, while paused and while scrubbing; otherwise hides after 8 seconds. */
function pokeTvBar() {

}

  const X = t => Math.max(0, Math.min(100, (t - ws) / (we - ws) * 100));

  el('tbNum').textContent = ch.num;
  el('tbName').textContent = ch.name;
  el('tbClock').textContent = fmtTime(now);
  renderStreamInfo();
  el('tbTitle').textContent = p ? p.title : ch.name;
  const n = p && !(S.catchup && !S.catchup.ts) ? neighbor(ch, p, 1) : null;
  el('tbSub').innerHTML = p ? `${fmtTime(p.start)} – ${fmtTime(p.end)}${S.catchup && !S.catchup.ts ? ' · catch-up' : ''}${n ? `<b>Next</b>${fmtTime(n.start)}  ${esc(n.title)}` : ''}` : 'No program information';
  const flag = el('tbFlag'), atLive = tl.kind === 'live' && tl.behind < 15 && !tl.paused;

  const aL = X(Math.max(tl.min, ws)), aR = X(Math.min(tl.max, we));
  el('tbAvail').style.cssText = `left:${aL.toFixed(2)}%;width:${Math.max(0, aR - aL).toFixed(2)}%`;

  const btn = a => el('tbBtns').querySelector(`[data-tb="${a}"]`);
  const pb = btn('pause');
  if (pb) { const use = pb.querySelector('use'); if (use) use.setAttribute('href', tl.paused ? '#i-play' : '#i-pause'); pb.lastChild.textContent = tl.paused ? 'Play' : 'Pause'; }
  const lv = btn('live'); if (lv) lv.classList.toggle('dim', atLive);
  const as = btn('aspect'); if (as) as.lastChild.textContent = aspectLabel();
  const au = btn('audio'), audio = audioTracksInfo();

  const fv = btn('fav'); if (fv) { fv.classList.toggle('on', favs.has(ch.id)); fv.lastChild.textContent = favs.has(ch.id) ? 'Favorite' : 'Add favorite'; }
}
/* ◀ ▶ on the timeline: steps grow while you hold the button (10 s up to 5 min). */
function scrubStep(dir, fixed) {
  const tl = timeline();
  if (!tl.can && tl.kind === 'live') { if (dir < 0) toast("This channel can't be rewound", 2000); else toast("You're watching live", 1600); return; }

  if (!SC.active) { SC.active = true; SC.target = tl.pos; SC.streak = 0; }
  SC.streak = now - SC.lastAt < 450 ? SC.streak + 1 : 0;
  SC.lastAt = now;
  const step = (fixed || [10, 10, 10, 15, 15, 30, 30, 30, 60, 60, 60, 120, 120, 300][Math.min(SC.streak, 13)]) * 1000;
  SC.target = Math.max(tl.min, Math.min(tl.max, SC.target + dir * step));

}
function cancelScrub() { clearTimeout(SC.timer); SC.active = false; }
function commitScrub() {

  setTimeout(renderTvBar, 450);
}
/* Jump to a moment on the clock: inside the stream when it allows, otherwise with catch-up; near now means live. */

  if (target >= now - 15000) { goLive(ch, tl); return; }
  if (demoVod()) { playTimeshift(ch, target); return; }
  const st = mediaState();
  if (tl.kind === 'timeshift' && st.seekable && target >= S.catchup.start) { mediaSeekBy(delta); return; }
  if (tl.kind === 'live' && tl.dvr && target >= tl.dvr) { mediaSeekBy(delta); return; }

function goLive(ch, tl) {
  const wasPaused = !!L.pausedAt; L.pausedAt = 0;
  if (S.catchup) { play(ch, { quiet: true }); toast('Back to live', 1500); return; }
  if (demoVod()) { if (wasPaused) demoSet(ch, null); return; }
  if (NATIVE) { try { window.NightdialNative.seekToLive(); if (tl && tl.paused) window.NightdialNative.setPaused(false); } catch (e) {} }
  else { try { const r = video.seekable; if (r && r.length) video.currentTime = Math.max(0, r.end(r.length - 1) - 1); if (video.paused) { const pr = video.play(); if (pr && pr.catch) pr.catch(() => {}); } } catch (e) {} }

}

/* Back / Escape: close what's open, return the guide to now, then the menu. Returns false when there's nothing left (the TV app then offers to exit). */
function handleBack() {
  if (groupMove) { finishGroupMove(); return true; }
  if (!numEl.hidden) { numEl.hidden = true; numBuf = ''; clearTimeout(numTimer); return true; }
  if (!loginEl.hidden) { if (loginCancelable) { closeLogin(); return true; } return false; }
  if (layers.length && layers[layers.length - 1].id === 'mgrDrawer') {
    if (mgr.moving) { const id = mgr.moving; mgr.moving = null; renderMgr({ key: id, col: 0 }); return true; }
    if (mgr.group) { const g = mgr.group; mgr.group = null; renderMgr({ key: g, col: 0 }); return true; }
  }
  // Back twice from the guide closes the app: the first press opens the menu, a second one within 2 seconds exits.
  if (TV_MODE && backArmed && Date.now() - backArmed < 2000 && layers.length === 1 && layers[0].id === 'tvNav') {
    backArmed = 0;
    if (window.NightdialNative && window.NightdialNative.exit) { try { window.NightdialNative.exit(); } catch (e) {} }
    else toast('On your Fire TV this closes Nightdial');
    return true;
  }
  if (layers.length) { closeLayer(); return true; }
  if (tvBarOpen()) { if (SC.active) { cancelScrub(); renderTvBar(); } else closeTvBar(); return true; }
  if (tvOptsOpen()) { closeTvOpts(); return true; }
  if (tvChansOpen()) { closeTvChans(); return true; }
  // In full screen, Back first clears the channel banner (or the movie's info) off the picture; the next Back leaves
  if (app.classList.contains('is-full') && S.vodPlaying && !el('vosd').classList.contains('hide') && !mediaState().paused) { clearTimeout(vosdTimer); el('vosd').classList.add('hide'); return true; }
  if (S.vodPlaying) { stopVod(); return true; }
  if (app.classList.contains('is-full') && !osd.classList.contains('hide') && screenMsg.hidden) { clearTimeout(osdTimer); osd.classList.add('hide'); return true; }
  if (app.classList.contains('is-full')) { exitFull(); return true; }
  const a = document.activeElement;
  if (S.view === 'vod') {
    if (a && a.closest && a.closest('#vodGrid')) { focusVodCat(); return true; }
    if (embyOn()) {
      // the library is home: Back opens the menu, and Back twice leaves Nightdial
      if (TV_MODE) { openTvNav(true); backArmed = Date.now(); return true; }
      const rb = document.querySelector('.rail-btn[data-nav="vod"]'); if (rb && rb.offsetParent) { rb.focus(); return true; }
      return false;
    }
    closeVod(); return true;
  }
  if (a && a.closest && a.closest('#rail')) return false;
  if (guideBackHome()) return true;
  // Back from the guide opens the channel groups (the main menu is one step Left)
  if (TV_MODE) { openTvNav(false); backArmed = Date.now(); return true; }

let backArmed = 0;
window.nightdialBack = handleBack;
/* Remote buttons sent by the Fire TV app (play/pause, menu, channel up/down, rewind, fast-forward).

window.nightdialKey = function (key) {

const REPEATING = new Set(['up', 'down', 'left', 'right', 'pgup', 'pgdn']);
let keyFrame = 0, okHold = null, okIsDown = false, okDownAt = 0;

function longOk() {

  // in the side menu's groups: pick the group up to move it

    const a = document.activeElement, g = a && a.closest && a.closest('#tvGroups [data-group]');
    if (g && g.dataset.group !== 'all' && g.dataset.group !== 'fav') { startGroupMove(g.dataset.group); return true; }

/* Stop the stream while the app or tab is in the background (providers limit connections), resume on return. */
document.addEventListener('visibilitychange', () => {

boot();
})();
