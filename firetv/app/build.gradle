plugins {
    id 'com.android.application'
}

// GitHub's build number becomes the version, so each new APK installs as an update.
def ciBuild = System.getenv('GITHUB_RUN_NUMBER')

android {
    namespace 'app.nightdial.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'app.tuner.tv'   // kept from the first release: changing it would install a second app and lose saved playlists
        minSdk 22        // Fire OS 5 and newer
        targetSdk 34
        versionCode ciBuild ? ciBuild.toInteger() + 1 : 1
        versionName ciBuild ? "1.1.${ciBuild}" : '1.1'
    }

    // One fixed key for every build, so a new APK installs over the old one and keeps your playlists.
    // It's only for sideloading onto your own devices.
    signingConfigs {
        sideload {
            storeFile file('nightdial-sideload.jks')
            storePassword 'nightdial-sideload'
            keyAlias 'nightdial'
            keyPassword 'nightdial-sideload'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.sideload
        }
        debug {
            signingConfig signingConfigs.sideload
        }
    }

    compileOptions {
        // the WireGuard library uses newer Java classes; this makes them work back to Fire OS 5
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // Android's media player: plays Dolby (AC3/E-AC3) audio, H.265 and raw MPEG-TS using the Fire TV's hardware decoders.
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    // Built-in VPN: the official WireGuard tunnel library.
    implementation 'com.wireguard.android:tunnel:1.0.20230706'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
